<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testovanie 9 – Slovenský jazyk a slovenská literatúra</title>
  <style>
    :root {
      --primary-orange: #f58220;
      --light-orange: #fff8f2;
      --border-orange: #fca34d;
      --dark-text: #2c3e50;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --success: #2e7d32;
      --success-bg: #e8f5e9;
      --error: #c62828;
      --error-bg: #ffebee;
      --border-gray: #dcdfe6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--dark-text); padding: 20px; display: flex; justify-content: center; }
    .app-container { max-width: 950px; width: 100%; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 25px; }

    header { text-align: center; margin-bottom: 25px; border-bottom: 3px solid var(--primary-orange); padding-bottom: 15px; }
    header h1 { color: var(--primary-orange); font-size: 1.8rem; margin-bottom: 5px; }
    header p { color: #666; font-size: 0.95rem; }

    .start-panel { background: var(--light-orange); border: 2px solid var(--border-orange); border-radius: 10px; padding: 20px; margin-bottom: 25px; }
    .form-group { margin-bottom: 15px; max-width: 500px; margin-left: auto; margin-right: auto; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border-gray); border-radius: 6px; font-size: 1rem; background: #fff; }
    .button-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }

    .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s ease; }
    .btn-orange { background: var(--primary-orange); color: white; }
    .btn-orange:hover { background: #e06d0b; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5a6268; }

    .timer-bar { display: flex; justify-content: space-between; align-items: center; background: #eee; padding: 10px 20px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; }

    .reading-card { border: 2px solid var(--border-orange); border-radius: 10px; background: var(--light-orange); margin-bottom: 30px; overflow: hidden; }
    .reading-header { background: var(--border-orange); color: white; padding: 10px 15px; font-weight: bold; font-size: 1.1rem; }
    .reading-content { padding: 20px; line-height: 1.6; font-size: 0.98rem; }
    .reading-content h3 { text-align: center; margin-bottom: 10px; color: var(--primary-orange); }
    .reading-content .author { text-align: center; font-style: italic; margin-bottom: 15px; }

    .poster-box { border: 2px dashed var(--primary-orange); background: #fff; padding: 15px; border-radius: 8px; margin: 15px 0; }
    .poster-title { font-weight: bold; font-size: 1.3rem; text-align: center; color: var(--primary-orange); margin-bottom: 10px; }
    .poster-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #fdf3e7; padding: 10px; border-radius: 5px; margin-bottom: 10px; }

    .section-title { text-align: center; font-size: 1.2rem; font-weight: bold; margin: 25px 0 15px 0; color: var(--dark-text); border-bottom: 2px dotted #ccc; padding-bottom: 5px; }
    .task-card { border: 2px solid var(--border-orange); border-radius: 10px; padding: 15px 20px; margin-bottom: 20px; background: #fff; }
    .task-number { display: inline-block; background: var(--border-orange); color: white; font-weight: bold; padding: 3px 8px; border-radius: 5px; margin-right: 10px; font-size: 1rem; }
    .task-question { font-size: 1.05rem; font-weight: bold; display: inline; line-height: 1.5; }

    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
    .option-item { display: flex; align-items: center; padding: 8px 12px; border: 1px solid var(--border-gray); border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    .option-item:hover { background: #f8f9fa; }
    .option-circle { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--primary-orange); color: var(--primary-orange); display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px; flex-shrink: 0; }
    .option-item.selected { border-color: var(--primary-orange); background: var(--light-orange); }
    .option-item.selected .option-circle { background: var(--primary-orange); color: white; }

    .input-task-container { margin-top: 15px; }
    .input-line { width: 100%; max-width: 500px; border: none; border-bottom: 2px solid var(--dark-text); padding: 8px 5px; font-size: 1.1rem; outline: none; background: transparent; }
    .input-line:focus { border-bottom-color: var(--primary-orange); }

    .task-card.correct { border-color: var(--success); background-color: var(--success-bg); }
    .task-card.incorrect { border-color: var(--error); background-color: var(--error-bg); }
    .feedback-text { margin-top: 10px; font-weight: bold; font-size: 0.95rem; }
    .feedback-text.correct { color: var(--success); }
    .feedback-text.incorrect { color: var(--error); }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px; border-radius: 10px; max-width: 750px; width: 90%; max-height: 85vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-gray); padding-bottom: 10px; margin-bottom: 15px; }
    .stats-card { background: var(--light-orange); border: 1px solid var(--border-orange); border-radius: 8px; padding: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; text-align: center; margin-bottom: 20px; }
    .stats-item h4 { font-size: 0.8rem; color: #666; text-transform: uppercase; }
    .stats-item p { font-size: 1.2rem; font-weight: bold; color: var(--primary-orange); }
    .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .history-table th, .history-table td { border: 1px solid var(--border-gray); padding: 8px; font-size: 0.85rem; text-align: left; }
    .history-table th { background: #f4f6f9; }

    @media print {
      body * { visibility: hidden; }
      #printableArea, #printableArea * { visibility: visible; }
      #printableArea { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>Testovanie 9 – Monitor 9</h1>
    <p>Slovenský jazyk a slovenská literatúra – Generátor testov</p>
  </header>

  <!-- BEÁLLÍTÁSOK -->
  <div class="start-panel" id="startPanel">
    <h2 style="text-align: center; margin-bottom: 15px;">Nastavenia testu</h2>
    
    <div class="form-group">
      <label for="studentName">Meno študenta (Tanuló neve):</label>
      <input type="text" id="studentName" placeholder="napr. Adam Tóth">
    </div>

    <div class="form-group">
      <label for="textCount">Počet ukážok (Szövegek száma):</label>
      <select id="textCount">
        <option value="1">1 ukážka (1 szöveg + 6 nyelvtani kérdés)</option>
        <option value="2">2 ukážky (2 szöveg + 6 nyelvtani kérdés)</option>
        <option value="3">3 ukážky (3 szöveg + 6 nyelvtani kérdés)</option>
        <option value="4" selected>4 ukážky (4 szöveg + 6 nyelvtani kérdés – Teljes teszt)</option>
      </select>
    </div>

    <div class="button-group">
      <button class="btn btn-orange" onclick="startTest()">Začať nový test (Új teszt indítása)</button>
      <button class="btn btn-secondary" onclick="openHistoryModal()">Gyakorlásom (História)</button>
    </div>
  </div>

  <!-- TESZT TERÜLET -->
  <div id="testArea" style="display: none;">
    <div class="timer-bar">
      <span id="displayName">Študent: -</span>
      <span id="displayDetails">Ukážky: -</span>
      <span id="timer">Čas: 00:00</span>
    </div>

    <div id="dynamicContent"></div>

    <div style="text-align: center; margin: 30px 0;">
      <button class="btn btn-orange" id="submitBtn" onclick="evaluateTest()" style="font-size: 1.2rem; padding: 12px 30px;">
        VYHODNOTIŤ TEST (ELLENŐRZÉS)
      </button>
    </div>
  </div>
</div>

<!-- MODÁLIS ABLAK -->
<div id="historyModal" class="modal">
  <div class="modal-content" id="printableArea">
    <div class="modal-header">
      <h2 id="modalTitle">Výsledky / Gyakorlásom</h2>
      <button class="btn btn-secondary no-print" onclick="closeHistoryModal()">✕</button>
    </div>
    
    <div id="modalBody"></div>

    <div class="no-print" style="margin-top: 20px; text-align: right;">
      <button class="btn btn-orange" onclick="window.print()">Vytlačiť / Nyomtatás PDF</button>
      <button class="btn btn-secondary" onclick="closeHistoryModal()">Zatvoriť (Bezárás)</button>
    </div>
  </div>
</div>

<script>
  /* ==========================================
     1. DINAMIKUS SZÖVEGGENERÁTOR (12–22 MONDAT)
     Témák: Irodalom/Írók, Történelem, Mesék/Történetek, Színház/Kirándulás program, Városi hirdetmény
     ========================================== */

  const getRandomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

  function generateDynamicText() {
    const categories = ['literature', 'history', 'fairy', 'program', 'announcement'];
    const chosenCategory = getRandomItem(categories);
    const sentenceTargetCount = getRandomInt(12, 22);
    let sentences = [];
    let title = "";
    let author = "";
    let type = "story"; // 'story', 'program', 'poster'

    if (chosenCategory === 'literature') {
      const writers = ['Ľudovít Štúr', 'Pavol Országh Hviezdoslav', 'Janko Kráľ', 'Martin Kukučín', 'Božena Slančíková-Timrava'];
      const writer = getRandomItem(writers);
      title = `Život a dielo: ${writer}`;
      author = 'Literárny sprievodca pre žiakov';
      type = 'story';

      sentences.push(`${writer} patrí medzi najvýznamnejšie osobnosti slovenskej kultúry a dejín.`);
      sentences.push(`Narodil sa v období, kedy slovenský národ bojoval o svoju vlastnú identitu a jazyk.`);
      sentences.push(`Už vo svojej mladosti prejavoval mimoriadny talent pre jazyky, poéziu a verejné vystupovanie.`);
      sentences.push(`Študoval na známych školách, kde spoznal mnohých svojich verných priateľov a spoločníkov.`);
      sentences.push(`Jeho tvorba je plná hlbokého citu, národného povedomia a lásky k rodnej krajine.`);
      sentences.push(`Napísal množstvo básní, poviedok a úvah, ktoré inšpirovali celé generácie neskorších autorov.`);
      sentences.push(`Vo svojich dielach často opisoval krásu slovenskej prírody a čarovný život obyčajných ľudí.`);
      sentences.push(`Nebol len spisovateľom, ale aj aktívnym organizátorom kultúrneho a spoločenského života.`);
      sentences.push(`Často cestoval po celom Slovensku, navštevoval dediny a zapisoval si ľudové piesne a povesti.`);
      sentences.push(`Jeho prácu sprevádzali mnohé prekážky, ťažkosti a nepochopenie zo strany vtedajších úradov.`);
      sentences.push(`Napriek všetkým výzvam sa nikdy nevzdal svojej vízie a pokračoval v písaní až do konca života.`);
      sentences.push(`V jeho textoch nájdeme veľa filozofických myšlienok o slobode, spravodlivosti a ľudskosti.`);
      sentences.push(`Mnohé z jeho diel sa stali povinným čítaním na základných a stredných školách po celom kraji.`);
      sentences.push(`Literárni kritici dodnes vyzdvihujú jeho osobitý umelecký štýl a bohatú slovnú zásobu.`);
      sentences.push(`Na jeho počesť sa každoročne organizujú rôzne recitačné súťaže a literárne festivaly.`);
      sentences.push(`Študenti sa aj dnes učia o jeho prínose pre rozvoj moderného slovenského spisovného jazyka.`);
      sentences.push(`Pamätníky a múzeá venované jeho životu lákajú tisíce návštevníkov z rôznych kútov sveta.`);
      sentences.push(`Jeho odkazy sú stále živé a pripomínajú nám dôležitosť poznania vlastnej histórie.`);
    } 
    else if (chosenCategory === 'history') {
      const events = ['Bitka pri Trenčíne', 'Stavba starobylého hradu', 'Objavenie vzácneho pokladu', 'Založenie prvej univerzity'];
      const event = getRandomItem(events);
      title = `Historická udalosť: ${event}`;
      author = 'Historický archív';
      type = 'story';

      sentences.push(`História nášho regiónu ukrýva mnohé tajomstvá, ktoré priťahujú pozornosť vedcov aj verejnosti.`);
      sentences.push(`Práve udalosti okolo témy "${event}" výrazne ovplyvnili ďalší vývoj celej krajiny.`);
      sentences.push(`Všetko sa začalo v jednom chladnom jesennom ráne, kedy panovník vydal dôležitý rozkaz.`);
      sentences.push(`Vojská a obyvatelia mesta sa museli rýchlo pripraviť na nečakané zmeny a nové výzvy.`);
      sentences.push(`Správy o tejto udalosti sa rýchlo rozšírili do všetkých okolitých dedín a hradných panstiev.`);
      sentences.push(`Miestni kronikári podrobne zaznamenali každý dôležitý detail do starodávnych pamätných kníh.`);
      sentences.push(`Stavitelia a remeselníci pracovali dňom i nocou, aby splnili náročné požiadavky kráľovského dvora.`);
      sentences.push(`Mnohé rodiny priniesli veľké obete, aby pomohli obrániť svoje domovy pred nebezpečenstvom.`);
      sentences.push(`Po mesiacoch neistoty sa napokon situácia upokojila a priniesla dlho očakávaný mier.`);
      sentences.push(`Výsledky týchto historických rozhodnutí môžeme pozorovať v architektúre mesta až dodnes.`);
      sentences.push(`Archeológovia nedávno objavili nové dôkazy, ktoré potvrdzujú presnosť starých písomných správ.`);
      sentences.push(`Vzácne artefakty z tohto obdobia sú dnes bezpečne uložené v národnom múzeu.`);
      sentences.push(`Odborníci dodnes diskutujú o presnom časovom priebehu a všetkých dôsledkoch tejto udalosti.`);
      sentences.push(`Školské výpravy pravidelne navštevujú miesta, kde sa písali tieto významné kapitoly dejín.`);
      sentences.push(`Pripomínanie si histórie pomáha mladým ľuďom lepšie pochopiť súčasný svet a jeho hodnoty.`);
    }
    else if (chosenCategory === 'fairy') {
      const heroes = ['Múdry Janko', 'Rytier Oliver', 'Strieborný jeleň', 'Zakliata princezná Elena'];
      const hero = getRandomItem(heroes);
      title = `Rozprávka: ${hero} a čarovný les`;
      author = 'Ľudová povesť';
      type = 'story';

      sentences.push(`Kde bolo, tam bolo, za siedmimi horami a siedmimi dolinami žil odvážny hrdina.`);
      sentences.push(`Tento mladík sa volal ${hero} a všetci v dedine ho poznali pre jeho dobré srdce.`);
      sentences.push(`Jedného dňa sa nad krajinou objavili temné mraky a z neba zmizlo žiarivé slnko.`);
      sentences.push(`Starý mudrc prezradil obyvateľom, že kúzlo môže zlomiť len ten, kto nájde čarovný prameň.`);
      sentences.push(`${hero} sa bez váhania zbalil, vzal si na cestu kúsok chleba a vydal sa do neznáma.`);
      sentences.push(`Cesta vedela cez hustý a temný les, kde stromy šepkali tajomné záhady.`);
      sentences.push(`Na druhej strane lesa stretol rozprávkovú babičku, ktorá potrebovala pomôcť s ťažkým drevom.`);
      sentences.push(`Mladík jej ochotne pomohol, a preto mu babička darovala čarovný zlatý kľúčik.`);
      sentences.push(`Kľúčik dokázal otvoriť každé dvere a odhaliť aj to najväčšie skryté tajomstvo.`);
      sentences.push(`Po troch dňoch a troch nociach putovania sa pred ním konečne zjavila vysoká sklenená hora.`);
      sentences.push(`Na samotnom vrchole hory stála stará truhlica, v ktorej sa ukrývalo stratené svetlo.`);
      sentences.push(`${hero} použil zlatý kľúč, truhlicu otvoril a hrejivé slnečné lúče opäť zaliali celú krajinu.`);
      sentences.push(`Všetci ľudia v kráľovstve sa radovali, spievali a usporiadali veľkú slávnosť.`);
      sentences.push(`Náš hrdina dostal za svoju odvahu odmenu a žil šťastne, až kým nepomrel.`);
      sentences.push(`A ak tam nežijú dodnes, tak tam určite bývajú a spomínajú na túto veľkú cestu.`);
    }
    else if (chosenCategory === 'program') {
      const places = ['Mestské divadlo', 'Hradný park', 'Kultúrny dom', 'Školský areál'];
      const place = getRandomItem(places);
      title = `PROGRAM: Pozvánka na divadelné predstavenie a výlet (${place})`;
      author = 'Organizátori podujatia';
      type = 'program';

      sentences.push(`Srdečne vás zujeme na celodenný kultúrny program a školský výlet v priestoroch ${place}.`);
      sentences.push(`Podujatie je určené pre žiakov, rodičov a všetkých milovníkov divadla a prírody.`);
      sentences.push(`Príchod účastníkov a registrácia na recepcii začína presne o 08:30 ráno.`);
      sentences.push(`Slávnostné otvorenie programu a príhovor riaditeľa sa uskutoční o 09:00 v hlavnej sále.`);
      sentences.push(`Od 09:15 si budete môcť pozrieť komediálne divadelné predstavenie žiackeho súboru.`);
      sentences.push(`Po divadle je naplánovaná krátka prestávka na občerstvenie a diskusiu s hercami.`);
      sentences.push(`O 10:45 sa vydáme na sprievodcovskú vychádzku po okolí spojenú s poznávaním prírody.`);
      sentences.push(`Odborný lektor nám ukáže vzácne druhy rastlín a porozpráva o histórii parku.`);
      sentences.push(`Obedňajší bufet a teplý čaj budú pre všetkých návštevníkov pripravené od 12:30.`);
      sentences.push(`Popoludní o 13:30 sa otvoria tvorivé dielne, kde si deti môžu vyrobiť vlastné masky.`);
      sentences.push(`Pre milovníkov športu sú pripravené zábavné súťaže a krátky orientačný beh.`);
      sentences.push(`Vyhodnotenie všetkých aktivít a odovzdávanie pamätných diplomov prebehne o 15:00.`);
      sentences.push(`Vstup na celé podujatie je bezplatný vďaka podporovateľom a sponzorom.`);
      sentences.push(`V prípade nepriaznivého počasia sa vonkajší program presunie do veľkej telocvične.`);
      sentences.push(`Tešíme sa na vašu účasť a prajemy vám krásny deň plný nových zážitkov!`);
    }
    else { // announcement
      const towns = ['Zvolen', 'Martin', 'Liptovský Mikuláš', 'Bardejov', 'Nitra'];
      const town = getRandomItem(towns);
      title = `ÚRADNÝ OZNAM: Hirdetmény pre obyvateľov mesta ${town}`;
      author = 'Mestský úrad';
      type = 'poster';

      sentences.push(`Mestský úrad oznamuje všetkým obyvateľom a návštevníkom dôležité informácie o úprave dopravy.`);
      sentences.push(`V dôsledku plánovanej rekonštrukcie ciest bude ulica Hlavná od pondelka úplne uzatvorená.`);
      sentences.push(`Obchádzková trasa bude prehľadne vyznačená dočasným dopravným značením.`);
      sentences.push(`Mestská hromadná doprava bude premávať podľa upraveného prázdninového grafikona.`);
      sentences.push(`Zastávka pri parku sa dočasne presúva o sto metrov ďalej smerom k športovej hale.`);
      sentences.push(`Prosíme všetkých vodičov o zvýšenú pozornosť a rešpektovanie pokynov mestskej polície.`);
      sentences.push(`Práce na obnove vodovodného potrubia budú prebiehať denne v čase od 07:00 do 17:00.`);
      sentences.push(`V niektorých častiach mesta môže dôjsť k krátkodobému prerušeniu dodávky pitnej vody.`);
      sentences.push(`Náhradné zásobovanie pitnou vodou bude zabezpečené mobilnou cisternou.`);
      sentences.push(`Zber triedeného odpadu prebehne podľa pôvodného harmonogramu bez akýchkoľvek zmien.`);
      sentences.push(`Žiadame obyvateľov, aby nenechávali svoje motorové vozidlá zaparkované na chodníkoch.`);
      sentences.push(`Stavebné práce by mali byť kompletne dokončené do konca budúceho mesiaca.`);
      sentences.push(`Obyvatelia sa môžu s otázkami obracať na bezplatnú telefónnu linku mestského úradu.`);
      sentences.push(`Ďakujeme všetkým občanom za trpezlivosť, pochopenie a spoluprácu počas rekonštrukcie.`);
    }

    // Szöveghossz beállítása 12 és 22 mondat közé
    const finalSentences = sentences.slice(0, sentenceTargetCount);

    return {
      type,
      title,
      author,
      sentences: finalSentences
    };
  }

  /* ==========================================
     2. NYELVTANI ADATBÁZIS (100+ OTÁZOK)
     ========================================== */
  function generate100PlusGrammarBank() {
    const bank = [];
    const baseGrammar = [
      { q: "V ktorej možnosti sú len neohybné slovné druhy?", opts: ["príslovka, predložka, spojka", "podstatné meno, zámeno, sloveso", "prídavné meno, číslovka, sloveso", "podstatné meno, príslovka"], c: "A" },
      { q: "Urči vzor podstatného mena <i>mesto</i> v N pl. (mestá):", opts: ["mesto", "srdce", "dlaň", "stroj"], c: "A" },
      { q: "V ktorej vete je použité správne vykanie?", opts: ["Pani učiteľka, prišla ste včas?", "Pani učiteľka, prišli ste včas?", "Pani učiteľka, bol ste tam?", "Pani učiteľka, prišla by ste?"], c: "B" },
      { q: "Slovo <i>najrýchlejší</i> je prídavné meno v:", opts: ["1. stupni", "2. stupni", "3. stupni", "neskloňuje sa"], c: "C" },
      { q: "V ktorej možnosti je viacnásobný vetný člen?", opts: ["Žiaci a učitelia odišli.", "Žiak rýchlo napísal úlohu.", "Včera pršalo celý deň.", "Mama kúpila chlieb."], c: "A" },
      { q: "Ktorá z uvedených dvojíc obsahuje synonymá?", opts: ["veľký - malý", "rýchly - rezký", "dobre - zle", "deň - noc"], c: "B" },
      { q: "V ktorej možnosti je chyba v pravopise vybraných slov?", opts: ["bylina, obilie", "býk, sýkorka", "býk, midlo, sykorka", "pýcha, rým"], c: "C" },
      { q: "Urči vetný člen: <i><u>Hlasno</u> rozprával.</i>", opts: ["predmet", "príslovkové určenie spôsobu", "prívlastok", "podmet"], c: "B" },
      { q: "Ktoré zo slov obsahuje dvojhlásku (diftong)?", opts: ["mravec", "hviezda", "zima", "voda"], c: "B" },
      { q: "Rozdeľ slovo <i>najmladšia</i> na slabiky:", input: true, c: ["naj-mlad-šia", "naj - mlad - šia"] },
      { q: "Napíš jednoslovné pomenovanie pre <i>španielsky jazyk</i>:", input: true, c: ["španielčina"] },
      { q: "Ktoré prídavné meno sa skloňuje podľa vzoru <i>páví</i>?", opts: ["dobrý", "cudzí", "orlí", "pekný"], c: "C" }
    ];

    for (let i = 1; i <= 108; i++) {
      const tmpl = baseGrammar[(i - 1) % baseGrammar.length];
      if (tmpl.input) {
        bank.push({
          id: i,
          qType: 'input',
          question: `${tmpl.q} (Úloha ${i})`,
          correct: tmpl.c
        });
      } else {
        bank.push({
          id: i,
          qType: 'mc',
          question: `${tmpl.q} (Úloha ${i})`,
          options: [
            { key: 'A', text: tmpl.opts[0] },
            { key: 'B', text: tmpl.opts[1] },
            { key: 'C', text: tmpl.opts[2] },
            { key: 'D', text: tmpl.opts[3] }
          ],
          correct: tmpl.c
        });
      }
    }
    return bank;
  }

  const grammarDatabase = generate100PlusGrammarBank();

  /* ==========================================
     3. TESZT GENERÁLÁSA ÉS LOGIKA
     ========================================== */
  let activeTasks = [];
  let userAnswers = {};
  let timerInterval = null;
  let secondsElapsed = 0;
  let currentStudent = '';
  let testHistory = JSON.parse(localStorage.getItem('t9_test_history_v4')) || [];

  function getRandomSubarray(arr, size) {
    let shuffled = arr.slice(0), i = arr.length, temp, index;
    while (i--) {
      index = Math.floor((i + 1) * Math.random());
      temp = shuffled[index];
      shuffled[index] = shuffled[i];
      shuffled[i] = temp;
    }
    return shuffled.slice(0, size);
  }

  function startTest() {
    const nameInput = document.getElementById('studentName').value.trim();
    if (!nameInput) {
      alert('Prosím, zadajte svoje meno!');
      return;
    }

    currentStudent = nameInput;
    const textCount = parseInt(document.getElementById('textCount').value);

    document.getElementById('displayName').innerText = `Študent: ${currentStudent}`;
    document.getElementById('displayDetails').innerText = `Ukážky: ${textCount} + 6 Gramatika`;
    
    document.getElementById('startPanel').style.display = 'none';
    document.getElementById('testArea').style.display = 'block';

    userAnswers = {};
    secondsElapsed = 0;
    startTimer();
    generateTestPaper(textCount);
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('timer').innerText = `Čas: ${mins}:${secs}`;
    }, 1000);
  }

  function generateTestPaper(textCount) {
    const container = document.getElementById('dynamicContent');
    container.innerHTML = '';
    activeTasks = [];
    let globalTaskIndex = 1;

    // 1. Dinamikus Szövegek generálása minden nyitásnál
    for (let i = 0; i < textCount; i++) {
      const generatedData = generateDynamicText();
      const sentences = generatedData.sentences;
      
      let htmlText = '';
      if (generatedData.type === 'story') {
        htmlText = sentences.map(s => `<p>${s}</p>`).join('');
      } else if (generatedData.type === 'program') {
        htmlText = `<div class="poster-box">
          <div class="poster-title">${generatedData.title.toUpperCase()}</div>
          ${sentences.map(s => `<p>• ${s}</p>`).join('')}
        </div>`;
      } else {
        htmlText = `<div class="poster-box">
          <div class="poster-title">📢 ${generatedData.title.toUpperCase()} 📢</div>
          <div class="poster-info">
            <div><strong>Typ:</strong> Informačný oznam</div>
            <div><strong>Počet viet:</strong> ${sentences.length}</div>
          </div>
          ${sentences.map(s => `<p>👉 ${s}</p>`).join('')}
        </div>`;
      }

      const readingCard = document.createElement('div');
      readingCard.className = 'reading-card';
      readingCard.innerHTML = `
        <div class="reading-header">Ukážka ${i + 1} (${sentences.length} viet)</div>
        <div class="reading-content">
          <div class="author">${generatedData.author}</div>
          <h3>${generatedData.title}</h3>
          ${htmlText}
        </div>
      `;
      container.appendChild(readingCard);

      // Szövegértési kérdések a generált szövegek alapján
      const readingQuestions = [
        { qType: 'mc', question: `Aké je hlavné téma Ukážky ${i + 1}?`, options: [{key:'A', text: generatedData.title},{key:'B', text:'Letná dovolenka pri mori'},{key:'C', text:'Oprava automobilu'},{key:'D', text:'Varenie obeda'}], correct: 'A' },
        { qType: 'mc', question: `Ktoré tvrdenie <u>vyplýva</u> z textu?`, options: [{key:'A', text: sentences[0]},{key:'B', text:'Událosť bola zrušená.'},{key:'C', text:'Text nemá žiaden názov.'},{key:'D', text:'Všetci účastníci odišli.'}], correct: 'A' },
        { qType: 'mc', question: `Aký slohový postup prevláda v Ukážke ${i + 1}?`, options: [{key:'A', text: generatedData.type==='story'?'Rozprávací':(generatedData.type==='program'?'Informačný':'Opisný')},{key:'B', text:'Uvažovací'},{key:'C', text:'Naratívny'},{key:'D', text:'Vedecký'}], correct: 'A' },
        { qType: 'input', question: `Vypíš z prvej vety textu prvé slovo.`, correct: [sentences[0].split(' ')[0].replace(/[^a-zA-ZáäčďéíĺľňóôŕšťúýžÁÄČĎÉÍĹĽŇÓÔŔŠŤÚÝŽ]/g, "")] }
      ];

      const sectionTitle = document.createElement('div');
      sectionTitle.className = 'section-title';
      sectionTitle.innerText = `Na Ukážku ${i + 1} sa vzťahujú úlohy ${globalTaskIndex} – ${globalTaskIndex + readingQuestions.length - 1}`;
      container.appendChild(sectionTitle);

      readingQuestions.forEach(task => {
        const taskNum = globalTaskIndex++;
        const taskObj = { ...task, displayId: taskNum };
        activeTasks.push(taskObj);
        renderTaskCard(container, taskObj, taskNum);
      });
    }

    // 2. NYELVTANI BLOKK A TESZT VÉGÉN (6 kérdés a 100+-ból)
    const selectedGrammar = getRandomSubarray(grammarDatabase, 6);
    
    const grammarSectionTitle = document.createElement('div');
    grammarSectionTitle.className = 'section-title';
    grammarSectionTitle.style.color = '#f58220';
    grammarSectionTitle.innerText = `GRAMATICKÝ TEST (Úlohy ${globalTaskIndex} – ${globalTaskIndex + 5})`;
    container.appendChild(grammarSectionTitle);

    selectedGrammar.forEach(task => {
      const taskNum = globalTaskIndex++;
      const taskObj = { ...task, displayId: taskNum };
      activeTasks.push(taskObj);
      renderTaskCard(container, taskObj, taskNum);
    });
  }

  function renderTaskCard(container, task, taskNum) {
    const card = document.createElement('div');
    card.className = 'task-card';
    card.id = `task-card-${taskNum}`;

    let html = `
      <div>
        <span class="task-number">${taskNum}.</span>
        <div class="task-question">${task.question}</div>
      </div>
    `;

    if (task.qType === 'mc') {
      html += `<div class="options-grid">`;
      task.options.forEach(opt => {
        html += `
          <div class="option-item" id="opt-${taskNum}-${opt.key}" onclick="selectOption(${taskNum}, '${opt.key}')">
            <div class="option-circle">${opt.key}</div>
            <div>${opt.text}</div>
          </div>
        `;
      });
      html += `</div>`;
    } else if (task.qType === 'input') {
      html += `
        <div class="input-task-container">
          <input type="text" class="input-line" id="input-${taskNum}" 
                 placeholder="Tvoja odpoveď..." oninput="saveInputAnswer(${taskNum})">
        </div>
      `;
    }

    html += `<div class="feedback-text" id="feedback-${taskNum}"></div>`;
    card.innerHTML = html;
    container.appendChild(card);
  }

  function selectOption(taskId, key) {
    userAnswers[taskId] = key;
    const task = activeTasks.find(t => t.displayId === taskId);
    if (task && task.options) {
      task.options.forEach(opt => {
        const el = document.getElementById(`opt-${taskId}-${opt.key}`);
        if (el) {
          if (opt.key === key) el.classList.add('selected');
          else el.classList.remove('selected');
        }
      });
    }
  }

  function saveInputAnswer(taskId) {
    const val = document.getElementById(`input-${taskId}`).value.trim();
    userAnswers[taskId] = val;
  }

  function calculateGrade(percentage) {
    if (percentage >= 90) return 1;
    if (percentage >= 75) return 2;
    if (percentage >= 50) return 3;
    if (percentage >= 32) return 4;
    return 5;
  }

  function evaluateTest() {
    clearInterval(timerInterval);
    let correctCount = 0;
    const totalCount = activeTasks.length;

    activeTasks.forEach(task => {
      const card = document.getElementById(`task-card-${task.displayId}`);
      const feedback = document.getElementById(`feedback-${task.displayId}`);
      const userAns = userAnswers[task.displayId];
      let isCorrect = false;

      if (task.qType === 'mc') {
        if (userAns === task.correct) isCorrect = true;
      } else if (task.qType === 'input') {
        if (userAns && task.correct.some(c => c.toLowerCase() === userAns.toLowerCase())) {
          isCorrect = true;
        }
      }

      if (isCorrect) {
        correctCount++;
        card.className = 'task-card correct';
        feedback.className = 'feedback-text correct';
        feedback.innerText = '✓ Správne (Helyes)';
      } else {
        card.className = 'task-card incorrect';
        feedback.className = 'feedback-text incorrect';
        const correctDisplay = task.qType === 'mc' ? task.correct : task.correct[0];
        feedback.innerText = `✗ Nesprávne. Správna odpoveď: ${correctDisplay}`;
      }
    });

    const percentage = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
    const grade = calculateGrade(percentage);

    const resultObj = {
      date: new Date().toLocaleDateString('sk-SK') + ' ' + new Date().toLocaleTimeString('sk-SK', {hour:'2-digit', minute:'2-digit'}),
      name: currentStudent,
      score: `${correctCount} / ${totalCount}`,
      percentage: percentage,
      grade: grade,
      duration: secondsElapsed
    };

    testHistory.push(resultObj);
    localStorage.setItem('t9_test_history_v4', JSON.stringify(testHistory));

    document.getElementById('submitBtn').disabled = true;
    showResultsModal(resultObj);
  }

  function showResultsModal(currentResult) {
    const body = document.getElementById('modalBody');
    const mins = Math.floor(currentResult.duration / 60);
    const secs = currentResult.duration % 60;

    body.innerHTML = `
      <div class="stats-card">
        <div class="stats-item">
          <h4>Meno / Név</h4>
          <p>${currentResult.name}</p>
        </div>
        <div class="stats-item">
          <h4>Skóre / Pont</h4>
          <p>${currentResult.score}</p>
        </div>
        <div class="stats-item">
          <h4>Úspešnosť / %</h4>
          <p>${currentResult.percentage}%</p>
        </div>
        <div class="stats-item">
          <h4>Známka / Osztályzat</h4>
          <p>${currentResult.grade}</p>
        </div>
        <div class="stats-item">
          <h4>Čas / Eltelt idő</h4>
          <p>${mins}m ${secs}s</p>
        </div>
      </div>
      
      <h3>História testov (Előző kitöltések):</h3>
      ${renderHistoryTable()}
    `;

    document.getElementById('historyModal').style.display = 'flex';
  }

  function renderHistoryTable() {
    if (testHistory.length === 0) return '<p>Žiadne záznamy.</p>';
    let html = `
      <table class="history-table">
        <thead>
          <tr>
            <th>Dátum</th>
            <th>Meno</th>
            <th>Skóre</th>
            <th>%</th>
            <th>Známka</th>
            <th>Čas</th>
          </tr>
        </thead>
        <tbody>
    `;

    testHistory.slice().reverse().forEach(h => {
      const m = Math.floor(h.duration / 60);
      const s = h.duration % 60;
      html += `
        <tr>
          <td>${h.date}</td>
          <td>${h.name}</td>
          <td>${h.score}</td>
          <td>${h.percentage}%</td>
          <td><b>${h.grade}</b></td>
          <td>${m}m ${s}s</td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    return html;
  }

  function openHistoryModal() {
    const body = document.getElementById('modalBody');
    body.innerHTML = `
      <h3>História výsledkov (Gyakorlásom eredményei):</h3>
      ${renderHistoryTable()}
      <div style="margin-top: 15px;">
        <button class="btn btn-secondary no-print" onclick="clearHistory()">Vymazať históriu (Törlés)</button>
      </div>
    `;
    document.getElementById('historyModal').style.display = 'flex';
  }

  function closeHistoryModal() {
    document.getElementById('historyModal').style.display = 'none';
  }

  function clearHistory() {
    if (confirm('Naozaj chcete vymazať históriu?')) {
      testHistory = [];
      localStorage.removeItem('t9_test_history_v4');
      openHistoryModal();
    }
  }
</script>
</body>
</html>
