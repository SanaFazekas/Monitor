<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testovanie 9 – Slovenský jazyk a slovenská literatúra</title>
  <style>
    :root {
      --primary-orange: #f58220;
      --light-orange: #fff8f2;
      --border-orange: #fca34d;
      --dark-text: #2c3e50;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --success: #2e7d32;
      --success-bg: #e8f5e9;
      --error: #c62828;
      --error-bg: #ffebee;
      --border-gray: #dcdfe6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--dark-text); padding: 20px; display: flex; justify-content: center; }
    .app-container { max-width: 950px; width: 100%; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 25px; }

    header { text-align: center; margin-bottom: 25px; border-bottom: 3px solid var(--primary-orange); padding-bottom: 15px; }
    header h1 { color: var(--primary-orange); font-size: 1.8rem; margin-bottom: 5px; }
    header p { color: #666; font-size: 0.95rem; }

    .start-panel { background: var(--light-orange); border: 2px solid var(--border-orange); border-radius: 10px; padding: 20px; margin-bottom: 25px; }
    .form-group { margin-bottom: 15px; max-width: 500px; margin-left: auto; margin-right: auto; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border-gray); border-radius: 6px; font-size: 1rem; background: #fff; }
    .button-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }

    .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s ease; }
    .btn-orange { background: var(--primary-orange); color: white; }
    .btn-orange:hover { background: #e06d0b; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5a6268; }
    .btn-danger { background: #c62828; color: white; }
    .btn-danger:hover { background: #a31f1f; }

    .timer-bar { display: flex; justify-content: space-between; align-items: center; background: #eee; padding: 10px 20px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; }

    .reading-card { border: 2px solid var(--border-orange); border-radius: 10px; background: var(--light-orange); margin-bottom: 30px; overflow: hidden; }
    .reading-header { background: var(--border-orange); color: white; padding: 10px 15px; font-weight: bold; font-size: 1.1rem; }
    .reading-content { padding: 20px; line-height: 1.6; font-size: 0.98rem; }
    .reading-content h3 { text-align: center; margin-bottom: 10px; color: var(--primary-orange); }
    .reading-content .author { text-align: center; font-style: italic; margin-bottom: 15px; }

    .section-title { text-align: center; font-size: 1.2rem; font-weight: bold; margin: 25px 0 15px 0; color: var(--dark-text); border-bottom: 2px dotted #ccc; padding-bottom: 5px; }
    .task-card { border: 2px solid var(--border-orange); border-radius: 10px; padding: 15px 20px; margin-bottom: 20px; background: #fff; }
    .task-number { display: inline-block; background: var(--border-orange); color: white; font-weight: bold; padding: 3px 8px; border-radius: 5px; margin-right: 10px; font-size: 1rem; }
    .task-question { font-size: 1.05rem; font-weight: bold; display: inline; line-height: 1.5; }

    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
    .option-item { display: flex; align-items: center; padding: 8px 12px; border: 1px solid var(--border-gray); border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    .option-item:hover { background: #f8f9fa; }
    .option-circle { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--primary-orange); color: var(--primary-orange); display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px; flex-shrink: 0; }
    .option-item.selected { border-color: var(--primary-orange); background: var(--light-orange); }
    .option-item.selected .option-circle { background: var(--primary-orange); color: white; }

    .input-task-container { margin-top: 15px; }
    .input-line { width: 100%; max-width: 500px; border: none; border-bottom: 2px solid var(--dark-text); padding: 8px 5px; font-size: 1.1rem; outline: none; background: transparent; }
    .input-line:focus { border-bottom-color: var(--primary-orange); }

    .task-card.correct { border-color: var(--success); background-color: var(--success-bg); }
    .task-card.incorrect { border-color: var(--error); background-color: var(--error-bg); }
    .feedback-box { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 0.95rem; }
    .feedback-box.correct { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .feedback-box.incorrect { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .explanation { margin-top: 6px; font-style: italic; font-size: 0.9rem; color: #333; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px; border-radius: 10px; max-width: 750px; width: 90%; max-height: 85vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-gray); padding-bottom: 10px; margin-bottom: 15px; }
    .stats-card { background: var(--light-orange); border: 1px solid var(--border-orange); border-radius: 8px; padding: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; text-align: center; margin-bottom: 20px; }
    .stats-item h4 { font-size: 0.8rem; color: #666; text-transform: uppercase; }
    .stats-item p { font-size: 1.2rem; font-weight: bold; color: var(--primary-orange); }
    .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .history-table th, .history-table td { border: 1px solid var(--border-gray); padding: 8px; font-size: 0.85rem; text-align: left; }
    .history-table th { background: #f4f6f9; }

    @media print {
      body * { visibility: hidden; }
      #printableArea, #printableArea * { visibility: visible; }
      #printableArea { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>Testovanie 9 – Monitor 9</h1>
    <p>Slovenský jazyk a slovenská literatúra – Generátor testov</p>
  </header>

  <div class="start-panel" id="startPanel">
    <h2 style="text-align: center; margin-bottom: 15px;">Nastavenia testu</h2>
    
    <div class="form-group">
      <label for="studentName">Meno a priezvisko žiaka:</label>
      <input type="text" id="studentName" placeholder="napr. Mária Horváthová">
    </div>

    <div class="form-group">
      <label for="textCount">Počet textových ukážok:</label>
      <select id="textCount">
        <option value="1">1 ukážka + 5 všeobecných gramatických úloh</option>
        <option value="2">2 ukážky + 5 všeobecných gramatických úloh</option>
        <option value="3">3 ukážky + 5 všeobecných gramatických úloh</option>
        <option value="4" selected>4 ukážky + 5 všeobecných gramatických úloh (Kompletný test)</option>
      </select>
    </div>

    <div class="button-group">
      <button class="btn btn-orange" onclick="startTest()">Začať nový test</button>
      <button class="btn btn-secondary" onclick="openHistoryModal()">Moje výsledky a štatistika</button>
      <button class="btn btn-danger" onclick="clearHistory()">Vymazať štatistiku</button>
    </div>
  </div>

  <div id="testArea" style="display: none;">
    <div class="timer-bar">
      <span id="displayName">Žiak: -</span>
      <span id="displayDetails">Ukážky: -</span>
      <span id="timer">Čas: 00:00</span>
    </div>

    <div id="dynamicContent"></div>

    <div style="text-align: center; margin: 30px 0;">
      <button class="btn btn-orange" id="submitBtn" onclick="evaluateTest()" style="font-size: 1.2rem; padding: 12px 30px;">
        VYHODNOTIŤ TEST
      </button>
    </div>
  </div>
</div>

<div id="historyModal" class="modal">
  <div class="modal-content" id="printableArea">
    <div class="modal-header">
      <h2 id="modalTitle">Výsledky a štatistika</h2>
      <button class="btn btn-secondary no-print" onclick="closeHistoryModal()">✕</button>
    </div>
    
    <div id="modalBody"></div>

    <div class="no-print" style="margin-top: 20px; text-align: right;">
      <button class="btn btn-orange" onclick="window.print()">Vytlačiť / Uložiť ako PDF</button>
      <button class="btn btn-secondary" onclick="closeHistoryModal()">Zatvoriť</button>
    </div>
  </div>
</div>

<script>
  const getRandomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  const shuffleArray = (arr) => arr.slice().sort(() => Math.random() - 0.5);

  function buildOptions(correctText, distractorTexts) {
    const rawOptions = [
      { text: correctText, isCorrect: true },
      ...distractorTexts.map(t => ({ text: t, isCorrect: false }))
    ];
    const shuffledRaw = shuffleArray(rawOptions);
    const keys = ['A', 'B', 'C', 'D'];
    
    let correctKey = '';
    const finalOptions = shuffledRaw.map((item, index) => {
      const key = keys[index];
      if (item.isCorrect) correctKey = key;
      return { key: key, text: item.text };
    });

    return { options: finalOptions, correctKey: correctKey };
  }

  /* ========================================================
     BANKA VŠEOBECNÝCH GRAMATICKÝCH A LITERÁRNYCH ÚLOH (5. - 9. ROČNÍK)
     ======================================================== */
  const globalGrammarBank = [
    {
      type: 'mc',
      q: "V ktorej z nasledujúcich viet sa nachádza viacnásobný vetný člen?",
      correct: "Na území Slovenska žijú medvede a kamzíky.",
      distractors: [
        "Deviataci chodili na doučovanie z matematiky.",
        "Peťo vyliezol s ďalekohľadom na marhuľu.",
        "Dnes sme písali kontrolnú prácu z biológie."
      ],
      exp: "Slová 'medvede a kamzíky' tvoria viacnásobný podmet spojený spojkou a."
    },
    {
      type: 'mc',
      q: "V ktorej možnosti sú všetky slová napísané pravopisne správne?",
      correct: "mydlo, ľudový, sýkorka",
      distractors: [
        "rýchly, cibula, mišlienka",
        "nábytok, obilie, visoký",
        "bolavý, pýcha, korito"
      ],
      exp: "V slovách mydlo a sýkorka píšeme tvrdé y po obojakej spoluhláske podľa vybraných slov."
    },
    {
      type: 'input',
      q: "Rozdeľ správne slovo <i>najmladšia</i> na slabiky (použi pomlčky, napr. a-bo-ho):",
      correct: ["naj-mlad-šia"],
      exp: "Slovo najmladšia sa delí na slabiky takto: naj-mlad-šia."
    },
    {
      type: 'input',
      q: "Napíš pravopisne a gramaticky správne slovné spojenie <i>španielsky jazyk</i> ako jednoslovné pomenovanie:",
      correct: ["španielčina"],
      exp: "Jednoslovné vyjadrenie pojmu španielsky jazyk je podstatné meno španielčina."
    },
    {
      type: 'mc',
      q: "Ako sa nazýva krátky epický útvar, ktorého cieľom je podať mravné ponaučenie a v ktorom vystupujú väčšinou zvieratá?",
      correct: "bájka",
      distractors: ["rozprávka", "povešť", "poviedka"],
      exp: "Bájka je alegorický literárny žáner, v ktorom zvieratá nosia ľudské vlastnosti a nesie poučenie."
    },
    {
      type: 'mc',
      q: "V ktorej možnosti je použité správne vykanie?",
      correct: "Mohli by ste mi podať pohár?",
      distractors: [
        "Bol by ste ochotný odviezť ma?",
        "Povedala ste to susede?",
        "Robil ste to úplne sám?"
      ],
      exp: "Pri vykaní má sloveso v minulom čase tvar 2. osoby množného čísla (Mohli by ste)."
    },
    {
      type: 'mc',
      q: "Ktorá z nasledujúcich možností obsahuje IBA prídavné mená?",
      correct: "hravý, včelí, študentský, drevený",
      distractors: [
        "hrať, včela, študent, drevo",
        "hravo, včera, študentsky, drevene",
        "hravosť, včelár, štúdium, drevár"
      ],
      exp: "Všetky dané slová odpovedajú na otázky Aký? Čí? a patria medzi prídavné mená."
    },
    {
      type: 'mc',
      q: "Urči umelecký prostriedok v spojení <i>'zlaté slnko usmievalo sa na krajinu'</i>:",
      correct: "personifikácia (stotožnenie)",
      distractors: ["prirovnanie", "metonymia", "hyperbola"],
      exp: "Neživému objektu (slnku) sa pripisuje ľudská vlastnosť a činnosť (usmievať sa)."
    },
    {
      type: 'input',
      q: "Utvor tvar 3. osoby množného čísla prítomného času od slovesa <i>kresliť</i>:",
      correct: ["kreslia"],
      exp: "Tvar 3. osoby mn. č. je: oni/ony kreslia."
    },
    {
      type: 'mc',
      q: "V ktorej z uvedených možností sa nachádza zámeno?",
      correct: "Nikto tam nebol.",
      distractors: [
        "Usilovala sa veľmi.",
        "Rýchlo utekal domov.",
        "Zajtra príde návšteva."
      ],
      exp: "Slovo 'nikto' je neurčité/záporné zámeno."
    }
  ];

  /* ========================================================
     DYNAMICKÉ TEXTY A BANKA OTÁZOK NA POROZUMENIE
     ======================================================== */
  function generateDynamicText() {
    const categories = ['fairy', 'history', 'encyclopedia', 'biography'];
    const chosenCategory = getRandomItem(categories);
    const targetSentenceCount = getRandomInt(10, 20); 
    let sentences = [];
    let title = "";
    let author = "";

    if (chosenCategory === 'fairy') {
      title = `Rozprávka o stratenom poklade`;
      author = 'Ľudová slovesnosť';
      sentences = [
        `Za siedmimi horami a siedmimi riekami žil starý a múdry kráľ.`,
        `Kráľ mal tri dcéry, no najmladšia z nich vynikala dobrotou a úprimnosťou.`,
        `Jedného dňa sa z kráľovského trezoru stratil vzácny čarovný prsteň.`,
        `Panovník vyhlásil, že ten, kto prsteň nájde, dostane polovicu kráľovstva.`,
        `Na cestu za hľadaním pokladu sa vydali mnohí odvážni rytieri z celého okolia.`,
        `Cesta ich viedla cez temný a nepreniknuteľný les plný pascí.`,
        `Na pokraji lesa stála malá chalúpka, v ktorej bývala stará starenka.`,
        `Starenka žiadala pocestných o kúsok chleba a čistú vodu.`,
        `Len najmladší princ sa so starenkou podelil o svoje skromné zásoby.`,
        `Za jeho dobré srdce mu starenka poradila, kde sa ukrýva tajná jaskyňa.`,
        `V jaskyni strážil prsteň obrovský trojhlavý drak.`,
        `Princ namiesto boja použil svoju múdrosť a rozprával drakovi príbehy.`,
        `Drak zaspal a princ potichu vzal čarovný prsteň zo stola.`,
        `Vrátením prsteňa sa v celom kráľovstve opäť obnovil mier a radosť.`,
        `Kráľ dodržal svoj sľub a usporiadal veľkolepú hostinu pre celú krajinu.`,
        `Všetci obcania oslavovali spravodlivosť a odvahu mladého princa.`,
        `Od tých čias vladla v krajine spokojnosť a ľud žil v dostatku.`,
        `Rozprávka nám pripomína, že múdrosť a dobrota sú mocnejšie ako meč.`,
        `Každoročne si tento deň ľudia pripomínali veselými slávnosťami.`,
        `A tak žijú šťastne, ak nepomreli dodnes.`
      ];
    } else if (chosenCategory === 'history') {
      title = `Význam hradov na území Slovenska`;
      author = 'Historický obzor';
      sentences = [
        `Hrady na našom území plnili v minulosti predovšetkým obrannú funkciu.`,
        `Stavali sa na vysokých bralách a ťažko prístupných miestach.`,
        `Okrem vojakov na hradoch žili panovníci, šľachta a početná služobníctvo.`,
        `Hradné múry museli odolať mnohým nájazdom nepriateľských vojsk.`,
        `Súčasťou väčšiny hradov boli aj hlboké studne a tajné chodby.`,
        `V období mieru slúžili hradné objekty ako strediská správy a obchodu.`,
        `S príchodom novších vojenských technológií strácali hrady svoj význam.`,
        `Mnohé z nich postupne schátrali a zmenili sa na romantické zrúcaniny.`,
        `Dnes sú naše hrady významnými kultúrnymi a historickými pamiatkami.`,
        `Archeológovia na nich neustále objavujú vzácne predmety z minulosti.`,
        `Návštevníci môžu v múzeách obdivovať dobové zbrane, odery a nábytok.`,
        `Konzervácia hradných múrov vyžaduje veľké úsilie a finančné prostriedky.`,
        `Mnoho dobrovoľníkov venuje svoj voľný čas obnove týchto pamiatok.`,
        `Letné festivaly na hradoch lákajú tisíce turistov z celého sveta.`,
        `Hrady pripomínajú bohatú históriu a staviteľské umenie našich predkov.`,
        `Ochrana tohto dedičstva je povinnosťou pre nasledujúce generácie.`,
        `Väčšina hradov ponúka aj nádherný výhľad na okolitú prírodu.`,
        `O mnohých hradoch sa zachovali zaujímavé povesti a legendy.`,
        `Prehliadky so sprievodcom približujú každodenný život v stredoveku.`,
        `Návšteva hradu je skvelým zážitkom pre rodiny aj školské výlety.`
      ];
    } else if (chosenCategory === 'encyclopedia') {
      title = `Tajomstvá lesného ekosystému`;
      author = 'Svet prírody';
      sentences = [
        `Lesy tvoria nezastupiteľnú súčasť životného prostredia na našej Zemi.`,
        `Produkujú kyslík, ktorý je nevyhnutný pre život väčšiny živých organizmov.`,
        `Stromové poschodie zachytáva prach a významne vyčisťuje ovzdušie.`,
        `Korene stromov spevňujú pôdu a chránia ju pred nebezpečnou eróziou.`,
        `V lese žije obrovské množstvo rôznych druhov rastlín, živočíchov a húb.`,
        `Každý organizmus má v lesnom ekosystéme svoju presnú úlohu.`,
        `Rastliny prijímajú slnečnú energiu a premieňajú ju v procese fotosyntézy.`,
        `Bylinožravce sa živia rastlinami a sami slúžia ako potrava pre dravce.`,
        `Rozkladače ako huby a baktérie premieňajú odumretú hmotu na živiny.`,
        `Znečistenie životného prostredia a vyrubovanie lesov ohrozuje túto rovnováhu.`,
        `Ochrana lesov je preto kľúčovou úlohou pre zachovanie biodiverzity.`,
        `Národné parky slúžia na ochranu najvzácnejších prírodných území.`,
        `Vychádzky do lesa majú priaznivý vplyv aj na ľudské zdravie a psychiku.`,
        `Lesný vzduch obsahuje zložky, ktoré podporujú imunitný systém.`,
        `Je dôležité dodržiavať pravidlá správania sa pri návšteve prírody.`,
        `Odpadky do lesa nepatria, pretože môžu ublížiť živočíchom.`,
        `Ticho v lese umožňuje pozorovať život zvierat v ich prirodzenom prostredí.`,
        `Udržateľné lesné hospodárstvo zabezpečuje drevo bez zničenia lesa.`,
        `Vzdelávanie o prírode pomáha vytvárať pozitívny vzťah k prostrediu.`,
        `Lesy sú pľúcami našej planéty a musíme ich chrániť.`
      ];
    } else {
      title = `Život a dielo Ľudovíta Štúra`;
      author = 'Literárna čítanka';
      sentences = [
        `Ľudovít Štúr sa narodil v roku 1815 v Uhrovci v učiteľskej rodine.`,
        `Bol hlavným kodifikátorom spisovného slovenského jazyka.`,
        `Študoval na lýceu v Bratislave a neskôr na univerzite v Halle.`,
        `Založil Katedru reči a literatúry česko-slovenskej v Bratislave.`,
        `Okolo sebe zhromaždil mladú generáciu nadšených študentov a národovcov.`,
        `V roku 1843 sa na fare v Hlbokom dohodol na uzákonení spisovnej slovenčiny.`,
        `Nová slovenčina bola založená na stredoslovenskom nárečí.`,
        `Vydával Slovenskie národňie noviny s prílohou Orol tatranský.`,
        `Pôsobil ako poslonec za mesto Zvolen na Uhorskom sneme.`,
        `Bojoval za sociálne a národné práva slovenského ľudu.`,
        `Jeho tvorba zahŕňa básne, vedecké spisy a novinárske články.`,
        `V roku 1848 sa aktívne zúčastnil na národnom povstaní.`,
        `Po neúspechu povstania žil pod policajným dozorom v Modre.`,
        `Venoval sa písaniu diel a vychovával deti svojho zosnulého brata.`,
        `Tragicky zomrel začiatkom roka 1856 na následky zranenia pri poľovačke.`,
        `Jeho odkaz zostáva živou súčasťou slovenskej kultúrnej identity.`,
        `Štúrovo meno nosia mnohé ulice, školy a inštitúcie na Slovensku.`,
        `Jeho život je príkladom obetavosti pre vlastný národ.`,
        `Pamätníky a múzeá pripomínajú jeho prácu a boj za slovenčinu.`,
        `Ľudovít Štúr patrí medzi najvýznamnejšie postavy našich dejín.`
      ];
    }

    const actualSentences = sentences.slice(0, targetSentenceCount);
    return {
      category: chosenCategory,
      title: title,
      author: author,
      sentences: actualSentences
    };
  }

  /* OTÁZKY NA POROZUMENIE PRE DANY TEXT */
  function generateReadingQuestions(textData) {
    const s = textData.sentences;
    const len = s.length;
    // Kratšia ukážka (<= 14 viet) = 4 otázky, Dlšia ukážka (> 14 viet) = 6 otázok
    const countNeeded = len <= 14 ? 4 : 6;
    let pool = [];

    // Question 1: Téma textu
    const opt1 = buildOptions(
      `Sprostredkovať poznatky a informácie k téme "${textData.title}".`,
      [
        `Kritizovať súčasný stav školstva a vzdelávania.`,
        `Podať podrobný návod na stavbu budovy.`,
        `Zábavným spôsobom opísať vymyslenú krajinu.`
      ]
    );
    pool.push({
      type: 'mc',
      q: `Aký je hlavný cieľ textu s názvom <i>"${textData.title}"</i>?`,
      options: opt1.options,
      correct: opt1.correctKey,
      exp: `Text prináša celistvé informácie na tému "${textData.title}".`
    });

    // Question 2: Hľadanie faktu podľa konkrétnej vety
    const idx = getRandomInt(1, Math.min(len, 5)) - 1;
    const sentenceFact = s[idx];
    const opt2 = buildOptions(
      `${sentenceFact}`,
      [
        `Veta č. ${idx + 1} uvádza nepresné informácie z neovereného zdroja.`,
        `Veta č. ${idx + 1} opisuje vymyslený príbeh bez reálneho základu.`,
        `Veta č. ${idx + 1} vyjadruje nesúhlas autora s danou témou.`
      ]
    );
    pool.push({
      type: 'mc',
      q: `Ktoré z nasledujúcich tvrdení odpovedá zneniu vety č. ${idx + 1}?`,
      options: opt2.options,
      correct: opt2.correctKey,
      exp: `Tvrdenie presne súhlasí s vetou č. ${idx + 1} v texte.`
    });

    // Question 3: Slohový postup
    let correctStyle = "informačný a opisný slohový postup";
    if (textData.category === 'fairy') correctStyle = "rozprávací slohový postup";
    else if (textData.category === 'encyclopedia') correctStyle = "výkladový slohový postup";

    const opt3 = buildOptions(
      correctStyle,
      ["rečnícky slohový postup", "dialogický slohový postup", "zápisničný štýl"]
    );
    pool.push({
      type: 'mc',
      q: `Aký slohový postup je prevládajúci v tejto ukážke?`,
      options: opt3.options,
      correct: opt3.correctKey,
      exp: `Vzhľadom na charakter textu prevláda ${correctStyle}.`
    });

    // Question 4: Výber podstatného mena alebo slovesa
    const wordTargetIdx = getRandomInt(0, 3);
    const words = s[wordTargetIdx].split(' ').map(w => w.replace(/[^a-zA-ZáäčďéíĺľňóôŕšťúýžÁÄČĎÉÍĹĽŇÓÔŔŠŤÚÝŽ]/g, ""));
    const selectedWord = words[0];

    pool.push({
      type: 'input',
      q: `Vypíš <b>PRVÉ SLOVO</b> z vety č. ${wordTargetIdx + 1}:`,
      correct: [selectedWord, selectedWord.toLowerCase()],
      exp: `Prvé slovo vety č. ${wordTargetIdx + 1} je "${selectedWord}".`
    });

    // Question 5: Synonýmum / Význam slova
    const opt5 = buildOptions(
      `Vyjadruje kľúčovú myšlienku úryvku v danom kontexte.`,
      [
        `Má opačný význam ako celá ukážka.`,
        `Je to zastarané slovo, ktoré sa dnes nepoužíva.`,
        `Slúži iba ako rým na konci verša.`
      ]
    );
    pool.push({
      type: 'mc',
      q: `Akej vlastnosti zodpovedá celkový obsahový význam prvej vety ukážky?`,
      options: opt5.options,
      correct: opt5.correctKey,
      exp: `Prvá veta uvádza čitateľa do hlavnej témy celého textu.`
    });

    // Question 6: Názov ukážky a autor
    const opt6 = buildOptions(
      `Autorom/zdrojom je ${textData.author}.`,
      [
        `Autor je neznámy zahraničný novinár.`,
        `Ukážka pochádza z básnickej zbierky.`,
        `Text bol prevzatý z divadelnej hry.`
      ]
    );
    pool.push({
      type: 'mc',
      q: `Ktoré tvrdenie o ukážke je pravdivé?`,
      options: opt6.options,
      correct: opt6.correctKey,
      exp: `Pod názvom textu je uvedený zdroj: ${textData.author}.`
    });

    return pool.slice(0, countNeeded);
  }

  /* ========================================================
     APLIKAČNÁ LOGIKA
     ======================================================== */
  let activeTasks = [];
  let userAnswers = {};
  let timerInterval = null;
  let secondsElapsed = 0;
  let currentStudent = '';
  let testHistory = JSON.parse(localStorage.getItem('t9_history_sk_v1')) || [];

  function startTest() {
    const nameInput = document.getElementById('studentName').value.trim();
    if (!nameInput) {
      alert('Prosím, zadajte meno a priezvisko žiaka!');
      return;
    }

    currentStudent = nameInput;
    const textCount = parseInt(document.getElementById('textCount').value);

    document.getElementById('displayName').innerText = `Žiak: ${currentStudent}`;
    document.getElementById('displayDetails').innerText = `Počet textov: ${textCount}`;
    
    document.getElementById('startPanel').style.display = 'none';
    document.getElementById('testArea').style.display = 'block';

    userAnswers = {};
    secondsElapsed = 0;
    startTimer();
    generateTestPaper(textCount);
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('timer').innerText = `Čas: ${mins}:${secs}`;
    }, 1000);
  }

  function generateTestPaper(textCount) {
    const container = document.getElementById('dynamicContent');
    container.innerHTML = '';
    activeTasks = [];
    let globalTaskIndex = 1;

    // 1. Textové ukážky a otázky na porozumenie
    for (let i = 0; i < textCount; i++) {
      const textData = generateDynamicText();
      const sentences = textData.sentences;
      const questionCount = sentences.length <= 14 ? 4 : 6;
      
      const readingCard = document.createElement('div');
      readingCard.className = 'reading-card';
      readingCard.innerHTML = `
        <div class="reading-header">Ukážka ${i + 1} (Počet viet: ${sentences.length} → ${questionCount} úlohy k ukážke)</div>
        <div class="reading-content">
          <div class="author">${textData.author}</div>
          <h3>${textData.title}</h3>
          ${sentences.map((s, idx) => `<p><b>[${idx + 1}]</b> ${s}</p>`).join('')}
        </div>
      `;
      container.appendChild(readingCard);

      const readingQuestions = generateReadingQuestions(textData);

      const sectionTitle = document.createElement('div');
      sectionTitle.className = 'section-title';
      sectionTitle.innerText = `Úlohy k Ukážke ${i + 1} (Úlohy č. ${globalTaskIndex} – ${globalTaskIndex + readingQuestions.length - 1})`;
      container.appendChild(sectionTitle);

      readingQuestions.forEach(task => {
        const taskNum = globalTaskIndex++;
        const taskObj = { ...task, displayId: taskNum };
        activeTasks.push(taskObj);
        renderTaskCard(container, taskObj, taskNum);
      });
    }

    // 2. Vždy 5 všeobecných gramatických otázok
    const grammarSectionTitle = document.createElement('div');
    grammarSectionTitle.className = 'section-title';
    grammarSectionTitle.innerText = `Všeobecné gramatické a literárne úlohy (Úlohy č. ${globalTaskIndex} – ${globalTaskIndex + 4})`;
    container.appendChild(grammarSectionTitle);

    const selectedGrammarTasks = shuffleArray(globalGrammarBank).slice(0, 5);
    selectedGrammarTasks.forEach(gTask => {
      const taskNum = globalTaskIndex++;
      let taskObj = { ...gTask, displayId: taskNum };

      if (gTask.type === 'mc' && !gTask.options) {
        const built = buildOptions(gTask.correct, gTask.distractors);
        taskObj.options = built.options;
        taskObj.correct = built.correctKey;
      }

      activeTasks.push(taskObj);
      renderTaskCard(container, taskObj, taskNum);
    });
  }

  function renderTaskCard(container, task, taskNum) {
    const card = document.createElement('div');
    card.className = 'task-card';
    card.id = `task-card-${taskNum}`;

    let html = `
      <div>
        <span class="task-number">${taskNum}.</span>
        <div class="task-question">${task.q}</div>
      </div>
    `;

    if (task.type === 'mc') {
      html += `<div class="options-grid">`;
      task.options.forEach(opt => {
        html += `
          <div class="option-item" id="opt-${taskNum}-${opt.key}" onclick="selectOption(${taskNum}, '${opt.key}')">
            <div class="option-circle">${opt.key}</div>
            <div>${opt.text}</div>
          </div>
        `;
      });
      html += `</div>`;
    } else if (task.type === 'input') {
      html += `
        <div class="input-task-container">
          <input type="text" class="input-line" id="input-${taskNum}" 
                 placeholder="Napíš odpoveď..." oninput="saveInputAnswer(${taskNum})">
        </div>
      `;
    }

    html += `<div id="feedback-${taskNum}"></div>`;
    card.innerHTML = html;
    container.appendChild(card);
  }

  function selectOption(taskId, key) {
    userAnswers[taskId] = key;
    const task = activeTasks.find(t => t.displayId === taskId);
    if (task && task.options) {
      task.options.forEach(opt => {
        const el = document.getElementById(`opt-${taskId}-${opt.key}`);
        if (el) {
          if (opt.key === key) el.classList.add('selected');
          else el.classList.remove('selected');
        }
      });
    }
  }

  function saveInputAnswer(taskId) {
    const val = document.getElementById(`input-${taskId}`).value.trim();
    userAnswers[taskId] = val;
  }

  function calculateGrade(percentage) {
    if (percentage >= 90) return 1;
    if (percentage >= 75) return 2;
    if (percentage >= 50) return 3;
    if (percentage >= 30) return 4;
    return 5;
  }

  function evaluateTest() {
    clearInterval(timerInterval);
    let correctCount = 0;
    const totalCount = activeTasks.length;

    activeTasks.forEach(task => {
      const card = document.getElementById(`task-card-${task.displayId}`);
      const feedback = document.getElementById(`feedback-${task.displayId}`);
      const userAns = userAnswers[task.displayId];
      let isCorrect = false;

      if (task.type === 'mc') {
        if (userAns === task.correct) isCorrect = true;
      } else if (task.type === 'input') {
        if (userAns && task.correct.some(c => c.toLowerCase() === userAns.toLowerCase())) {
          isCorrect = true;
        }
      }

      const correctDisplay = task.type === 'mc' ? task.correct : task.correct[0];

      if (isCorrect) {
        correctCount++;
        card.className = 'task-card correct';
        feedback.innerHTML = `
          <div class="feedback-box correct">
            <strong>✓ Správne!</strong>
            <div class="explanation"><b>Vysvetlenie:</b> ${task.exp}</div>
          </div>
        `;
      } else {
        card.className = 'task-card incorrect';
        feedback.innerHTML = `
          <div class="feedback-box incorrect">
            <strong>✗ Nesprávne.</strong> Správna odpoveď: <b>${correctDisplay}</b>
            <div class="explanation"><b>Vysvetlenie:</b> ${task.exp}</div>
          </div>
        `;
      }
    });

    const percentage = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
    const grade = calculateGrade(percentage);

    const resultObj = {
      date: new Date().toLocaleDateString('sk-SK') + ' ' + new Date().toLocaleTimeString('sk-SK', {hour:'2-digit', minute:'2-digit'}),
      name: currentStudent,
      score: `${correctCount} / ${totalCount}`,
      percentage: percentage,
      grade: grade,
      duration: secondsElapsed
    };

    testHistory.push(resultObj);
    localStorage.setItem('t9_history_sk_v1', JSON.stringify(testHistory));

    document.getElementById('submitBtn').disabled = true;
    showResultsModal(resultObj);
  }

  function getAveragePercentage() {
    if (testHistory.length === 0) return 0;
    const sum = testHistory.reduce((acc, item) => acc + item.percentage, 0);
    return Math.round(sum / testHistory.length);
  }

  function showResultsModal(currentResult) {
    const modal = document.getElementById('historyModal');
    const modalBody = document.getElementById('modalBody');
    const mins = Math.floor(currentResult.duration / 60);
    const secs = currentResult.duration % 60;

    modalBody.innerHTML = `
      <div class="stats-card">
        <div class="stats-item">
          <h4>Výsledok</h4>
          <p>${currentResult.score}</p>
        </div>
        <div class="stats-item">
          <h4>Úspešnosť</h4>
          <p>${currentResult.percentage}%</p>
        </div>
        <div class="stats-item">
          <h4>Známka</h4>
          <p>${currentResult.grade}</p>
        </div>
        <div class="stats-item">
          <h4>Čas</h4>
          <p>${mins}m ${secs}s</p>
        </div>
      </div>
      
      <h3>História testov:</h3>
      ${renderHistoryTable()}
    `;
    modal.style.display = 'flex';
  }

  function openHistoryModal() {
    const modal = document.getElementById('historyModal');
    const modalBody = document.getElementById('modalBody');

    modalBody.innerHTML = `
      <div class="stats-card">
        <div class="stats-item">
          <h4>Počet testov</h4>
          <p>${testHistory.length}</p>
        </div>
        <div class="stats-item">
          <h4>Priemerná úspešnosť</h4>
          <p>${getAveragePercentage()}%</p>
        </div>
      </div>
      
      <h3>História výsledkov:</h3>
      ${renderHistoryTable()}
    `;
    modal.style.display = 'flex';
  }

  function renderHistoryTable() {
    if (testHistory.length === 0) {
      return '<p style="margin-top: 10px; text-align: center; color: #777;">Doposiaľ neboli absolvované žiadne testy.</p>';
    }

    let html = `
      <table class="history-table">
        <thead>
          <tr>
            <th>Dátum</th>
            <th>Meno</th>
            <th>Skóre</th>
            <th>Úspešnosť</th>
            <th>Známka</th>
            <th>Čas</th>
          </tr>
        </thead>
        <tbody>
    `;

    testHistory.slice().reverse().forEach(item => {
      const m = Math.floor(item.duration / 60);
      const s = item.duration % 60;
      html += `
        <tr>
          <td>${item.date}</td>
          <td>${item.name}</td>
          <td>${item.score}</td>
          <td><b>${item.percentage}%</b></td>
          <td><b>${item.grade}</b></td>
          <td>${m}m ${s}s</td>
        </tr>
      `;
    });

    html += '</tbody></table>';
    return html;
  }

  function closeHistoryModal() {
    document.getElementById('historyModal').style.display = 'none';
  }

  function clearHistory() {
    if (confirm('Naozaj chcete vymazať celú štatistiku testov?')) {
      testHistory = [];
      localStorage.removeItem('t9_history_sk_v1');
      alert('Štatistika bola úspešne vymazaná.');
      closeHistoryModal();
    }
  }
</script>
