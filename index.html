<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testovanie 9 – Slovenský jazyk a slovenská literatúra</title>
  <style>
    /* ==========================================
       1. STÍLUSOK ÉS VIZUÁLIS ELRENDEZÉS
       ========================================== */
    :root {
      --primary-orange: #f58220;
      --light-orange: #fff8f2;
      --border-orange: #fca34d;
      --dark-text: #2c3e50;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --success: #2e7d32;
      --success-bg: #e8f5e9;
      --error: #c62828;
      --error-bg: #ffebee;
      --border-gray: #dcdfe6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--dark-text);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      max-width: 900px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 25px;
    }

    /* Fejléc */
    header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 3px solid var(--primary-orange);
      padding-bottom: 15px;
    }

    header h1 {
      color: var(--primary-orange);
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    header p {
      color: #666;
      font-size: 0.95rem;
    }

    /* Start / Beállítások panel */
    .start-panel {
      background: var(--light-orange);
      border: 2px solid var(--border-orange);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 15px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-gray);
      border-radius: 6px;
      font-size: 1rem;
      background: #fff;
    }

    .button-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-orange { background: var(--primary-orange); color: white; }
    .btn-orange:hover { background: #e06d0b; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5a6268; }

    /* Stopper és fejléc infók */
    .timer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eee;
      padding: 10px 20px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    /* Olvasmány kártya */
    .reading-card {
      border: 2px solid var(--border-orange);
      border-radius: 10px;
      background: var(--light-orange);
      margin-bottom: 30px;
      overflow: hidden;
    }

    .reading-header {
      background: var(--border-orange);
      color: white;
      padding: 10px 15px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .reading-content {
      padding: 20px;
      line-height: 1.6;
      font-size: 0.98rem;
    }

    .reading-content h3 {
      text-align: center;
      margin-bottom: 10px;
    }

    .reading-content .author {
      text-align: center;
      font-style: italic;
      margin-bottom: 5px;
    }

    /* Feladat kártyák */
    .section-title {
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      margin: 25px 0 15px 0;
      color: var(--dark-text);
    }

    .task-card {
      border: 2px solid var(--border-orange);
      border-radius: 10px;
      padding: 15px 20px;
      margin-bottom: 20px;
      background: #fff;
    }

    .task-number {
      display: inline-block;
      background: var(--border-orange);
      color: white;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 5px;
      margin-right: 10px;
      font-size: 1rem;
    }

    .task-question {
      font-size: 1.05rem;
      font-weight: bold;
      display: inline;
      line-height: 1.5;
    }

    /* Feleletválasztós opciók */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .option-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      border: 1px solid var(--border-gray);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .option-item:hover { background: #f8f9fa; }

    .option-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--primary-orange);
      color: var(--primary-orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .option-item.selected {
      border-color: var(--primary-orange);
      background: var(--light-orange);
    }

    .option-item.selected .option-circle {
      background: var(--primary-orange);
      color: white;
    }

    /* Beíró mezők */
    .input-task-container { margin-top: 15px; }

    .input-line {
      width: 100%;
      max-width: 500px;
      border: none;
      border-bottom: 2px solid var(--dark-text);
      padding: 8px 5px;
      font-size: 1.1rem;
      outline: none;
      background: transparent;
    }

    .input-line:focus { border-bottom-color: var(--primary-orange); }

    /* Visszajelző stílusok */
    .task-card.correct { border-color: var(--success); background-color: var(--success-bg); }
    .task-card.incorrect { border-color: var(--error); background-color: var(--error-bg); }
    .feedback-text { margin-top: 10px; font-weight: bold; font-size: 0.95rem; }
    .feedback-text.correct { color: var(--success); }
    .feedback-text.incorrect { color: var(--error); }

    /* Modális ablak */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 10px;
      max-width: 750px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-gray);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .stats-card {
      background: var(--light-orange);
      border: 1px solid var(--border-orange);
      border-radius: 8px;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      text-align: center;
      margin-bottom: 20px;
    }

    .stats-item h4 { font-size: 0.8rem; color: #666; text-transform: uppercase; }
    .stats-item p { font-size: 1.2rem; font-weight: bold; color: var(--primary-orange); }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .history-table th, .history-table td {
      border: 1px solid var(--border-gray);
      padding: 8px;
      font-size: 0.85rem;
      text-align: left;
    }

    .history-table th { background: #f4f6f9; }

    @media print {
      body * { visibility: hidden; }
      #printableArea, #printableArea * { visibility: visible; }
      #printableArea { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>Testovanie 9 – Monitor 9</h1>
    <p>Slovenský jazyk a slovenská literatúra – Interaktívny generátor testov</p>
  </header>

  <!-- BEÁLLÍTÁSOK / INDÍTÁS -->
  <div class="start-panel" id="startPanel">
    <h2 style="text-align: center; margin-bottom: 15px;">Nastavenia testu (Teszt beállításai)</h2>
    
    <div class="form-group">
      <label for="studentName">Meno študenta (Tanuló neve):</label>
      <input type="text" id="studentName" placeholder="napr. Peter Kovács">
    </div>

    <div class="form-group">
      <label for="textCount">Počet ukážok (Szövegek száma):</label>
      <select id="textCount">
        <option value="1">1 ukážka (1 szöveg)</option>
        <option value="2">2 ukážky (2 szöveg)</option>
        <option value="3">3 ukážky (3 szöveg)</option>
        <option value="4">4 ukážky (4 szöveg)</option>
        <option value="5" selected>5 ukážok (5 szöveg – Teljes feladatsor)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="taskMode">Zameranie úloh (Feladatok típusa):</label>
      <select id="taskMode">
        <option value="mixed" selected>Všeobecný / Zmiešaný (Vegyes – Szövegértés + Nyelvtan)</option>
        <option value="reading">Len čítanie s porozumením (Csak szövegértési kérdések)</option>
        <option value="grammar">Len gramatika a pravopis (Csak nyelvtani kérdések)</option>
      </select>
    </div>

    <div class="button-group">
      <button class="btn btn-orange" onclick="startTest()">Začať test (Teszt indítása)</button>
      <button class="btn btn-secondary" onclick="openHistoryModal()">Gyakorlásom (História)</button>
    </div>
  </div>

  <!-- TESZT TERÜLET -->
  <div id="testArea" style="display: none;">
    <div class="timer-bar">
      <span id="displayName">Študent: -</span>
      <span id="displayDetails">Ukážky: -</span>
      <span id="timer">Čas: 00:00</span>
    </div>

    <!-- DINAMIKUSAN GENERÁLT KÁRTYÁK -->
    <div id="dynamicContent"></div>

    <!-- ELLENŐRZÉS GOMB -->
    <div style="text-align: center; margin: 30px 0;">
      <button class="btn btn-orange" id="submitBtn" onclick="evaluateTest()" style="font-size: 1.2rem; padding: 12px 30px;">
        VYHODNOTIŤ TEST (ELLENŐRZÉS)
      </button>
    </div>
  </div>
</div>

<!-- MODÁLIS ABLAK A STATISZTIKÁHOZ ÉS ELŐZMÉNYEKHEZ -->
<div id="historyModal" class="modal">
  <div class="modal-content" id="printableArea">
    <div class="modal-header">
      <h2 id="modalTitle">Výsledky / Gyakorlásom</h2>
      <button class="btn btn-secondary no-print" onclick="closeHistoryModal()">✕</button>
    </div>
    
    <div id="modalBody"></div>

    <div class="no-print" style="margin-top: 20px; text-align: right;">
      <button class="btn btn-orange" onclick="window.print()">Vytlačiť / Nyomtatás PDF</button>
      <button class="btn btn-secondary" onclick="closeHistoryModal()">Zatvoriť (Bezárás)</button>
    </div>
  </div>
</div>

<script>
  /* ==========================================
     2. SZÖVEG ÉS KÉRDÉSBÁZIS (5 UKÁŽKA)
     ========================================== */
  const database = [
    {
      id: 1,
      title: "Strýko Viktor a jeho počítač",
      author: "Marta Hlušíková",
      text: `<p>Strýko Viktor je programátor. Svojimi počítačovými programami uľahčuje prácu vedcom, inžinierom a dokonca i lekárom.</p>
             <p>Elenkin starší brat Maťo dostal zlú známku z diktátu. So svojím žiaľom sa rozhodol podeliť so strýkom Viktorom.</p>
             <p>„Vitaj, Maťko! Čo dobrého mi nesieš?“ potešil sa strýko. „Zlú známku z diktátu.“</p>
             <p>„Ako je to možné? Ja som diktáty písal vždy na jednotky!“ chytal sa strýko za hlavu. „Naučím ťa to na počítači...“</p>`,
      tasks: [
        { type: 'reading', qType: 'mc', question: 'Z ukážky vyplýva, že Maťo', options: [{key:'A', text:'poprosil strýka o pomoc s diktátom.'},{key:'B', text:'má strýka, ktorý je digitálne nezručný.'},{key:'C', text:'chce byť programátorom.'},{key:'D', text:'píše výborné diktáty.'}], correct: 'A' },
        { type: 'reading', qType: 'mc', question: 'Ktoré povolanie sa nespomína v ukážke?', options: [{key:'A', text:'lekár'},{key:'B', text:'inžinier'},{key:'C', text:'učiteľ'},{key:'D', text:'vedec'}], correct: 'C' },
        { type: 'grammar', qType: 'mc', question: 'V ktorej možnosti sú len neohybné slovné druhy?', options: [{key:'A', text:'potom, moju, teraz'},{key:'B', text:'svojím, vždy, takže'},{key:'C', text:'preto, dokonca, i'},{key:'D', text:'nemôžem, ich, všetky'}], correct: 'C' },
        { type: 'grammar', qType: 'input', question: 'Vypíš z ukážky prvú zvolaciu vetu.', correct: ['Vitaj, Maťko!', 'Vitaj, Maťko'] }
      ]
    },
    {
      id: 2,
      title: "Tatranský národný park",
      author: "Informačný text",
      text: `<p>Tatranský národný park (TANAP) je najstarší národný park na Slovensku, založený v roku 1949. Nachádza sa na severe Slovenska a chráni rozmanitú faunu a flóru.</p>
             <p>Medzi najvýznamnejšie chránené živočíchy patria kamzík tatranský, svišť vrchovský a medveď hnedý. Návštevníci musia dodržiavať návštevný poriadok a pohybovať sa len po vyznačených chodníkoch.</p>`,
      tasks: [
        { type: 'reading', qType: 'mc', question: 'V ktorom roku bol založený TANAP?', options: [{key:'A', text:'1939'},{key:'B', text:'1949'},{key:'C', text:'1989'},{key:'D', text:'1993'}], correct: 'B' },
        { type: 'reading', qType: 'mc', question: 'Ktorý živočích sa v texte uvádza ako chránený?', options: [{key:'A', text:'vlk dravý'},{key:'B', text:'svišť vrchovský'},{key:'C', text:'orol skalný'},{key:'D', text:'jeleň hnedý'}], correct: 'B' },
        { type: 'grammar', qType: 'mc', question: 'Slovo „najstarší“ v texte je:', options: [{key:'A', text:'prídavné meno v 3. stupni'},{key:'B', text:'prídavné meno v 2. stupni'},{key:'C', text:'podstatné meno'},{key:'D', text:'príslovka'}], correct: 'A' },
        { type: 'grammar', qType: 'input', question: 'Rozdeľ slovo „národný“ na slabiky.', correct: ['ná-rod-ný', 'ná - rod - ný'] }
      ]
    },
    {
      id: 3,
      title: "Milan Rastislav Štefánik",
      author: "Historický profil",
      text: `<p>Milan Rastislav Štefánik bol slovenský astronóm, fotograf, vojenský letec a politik. Mal významnú zásluhu na vzniku prvej Československej republiky.</p>
             <p>Jeho heslom bolo: „Veriť, milovať, pracovať.“ Zahynul pri tragickej havárii lietadla v roku 1919 neďaleko Ivanky pri Dunaji.</p>`,
      tasks: [
        { type: 'reading', qType: 'mc', question: 'Ktoré z uvedených povolaní Štefánik nevykonával?', options: [{key:'A', text:'astronóm'},{key:'B', text:'politik'},{key:'C', text:'zábavný herca'},{key:'D', text:'vojenský letec'}], correct: 'C' },
        { type: 'reading', qType: 'input', question: 'Vypíš z textu tri slovesá z hesla Štefánika (oddelené čiarkou).', correct: ['Veriť, milovať, pracovať', 'veriť, milovať, pracovať'] },
        { type: 'grammar', qType: 'mc', question: 'Ktoré zo slov obsahuje pravopisnú chybu?', options: [{key:'A', text:'astronóm'},{key:'B', text:'tragycký'},{key:'C', text:'havária'},{key:'D', text:'vztah'}], correct: 'B' },
        { type: 'grammar', qType: 'input', question: 'Napíš jednoslovné pomenovanie pre spojenie „československá republika“.', correct: ['Československo', 'československo'] }
      ]
    },
    {
      id: 4,
      title: "Múdrosť prírody",
      author: "Bájka",
      text: `<p>Mravec pracoval celé leto a zbieral zásoby na zimu. Cvrček zatiaľ iba spieval a tancoval. Keď prišla zima a udreli mrazy, cvrček nemal čo jesť.</p>
             <p>Prišiel poprosiť mravca o trocha zrna. Mravec sa ho spýtal: „Čo si robil v lete?“ „Spieval som,“ odvetil cvrček. „Tak teraz tancuj!“ odvetil mravec.</p>`,
      tasks: [
        { type: 'reading', qType: 'mc', question: 'Akej literárnej druh/žáner reprezentuje tento text?', options: [{key:'A', text:'bájka'},{key:'B', text:'poviedka'},{key:'C', text:'báseň'},{key:'D', text:'román'}], correct: 'A' },
        { type: 'reading', qType: 'mc', question: 'Aké mravné ponaučenie vyplýva z textu?', options: [{key:'A', text:'Spievať je dôležitejšie ako pracovať.'},{key:'B', text:'Treba myslieť na budúcnosť a pripraviť sa.'},{key:'C', text:'Každý ti v núdzi pomôže.'},{key:'D', text:'Zima býva vždy teplá.'}], correct: 'B' },
        { type: 'grammar', qType: 'mc', question: 'V ktorej možnosti je použité slovo s dvojhláskou (diftongom)?', options: [{key:'A', text:'mravec'},{key:'B', text:'zima'},{key:'C', text:'spieval'},{key:'D', text:'leto'}], correct: 'C' },
        { type: 'grammar', qType: 'input', question: 'Utvor zo slova „mravec“ množné číslo (nominatív pl.).', correct: ['mravce', 'mravci'] }
      ]
    },
    {
      id: 5,
      title: "Kúzlo kníh",
      author: "Úvaha",
      text: `<p>Knihy sú ako otvorené dvere do nových svetov. Umožňujú nám cestovať časom, spoznávať cudzích ľudí a zažívať dobrodružstvá bez toho, aby sme opustili izbu.</p>
             <p>Čítanie rozvíja slovnú zásobu, zlepšuje sústredenie a pomáha nám lepšie chápať pocity iných ľudí.</p>`,
      tasks: [
        { type: 'reading', qType: 'mc', question: 'Čo podľa textu rozvíja čítanie kníh?', options: [{key:'A', text:'fyzickú silu'},{key:'B', text:'slovnú zásobu a sústredenie'},{key:'C', text:'rýchlosť behu'},{key:'D', text:'zrak'}], correct: 'B' },
        { type: 'reading', qType: 'mc', question: 'Aké prirovnanie sa používa v prvej vete?', options: [{key:'A', text:'knihy sú ako otvorené dvere'},{key:'B', text:'knihy sú ako lietadlá'},{key:'C', text:'knihy sú ako zrkadlo'},{key:'D', text:'knihy sú ako kľúče'}], correct: 'A' },
        { type: 'grammar', qType: 'mc', question: 'Slovo „sústredenie“ má vzor declension (skloňovania):', options: [{key:'A', text:'mesto'},{key:'B', text:'srdce'},{key:'C', text:'vysvedčenie'},{key:'D', text:'dlaň'}], correct: 'C' },
        { type: 'grammar', qType: 'input', question: 'Napíš synonymum ku slovu „cudzie“ (napr. cudzie svety).', correct: ['neznáme', 'neprístupné', 'ine'] }
      ]
    }
  ];

  /* ==========================================
     3. JAVASCRIPT LOGIKA & RENDERELÉS
     ========================================== */
  let activeTasks = [];
  let userAnswers = {};
  let timerInterval = null;
  let secondsElapsed = 0;
  let currentStudent = '';
  let testHistory = JSON.parse(localStorage.getItem('t9_test_history')) || [];

  function startTest() {
    const nameInput = document.getElementById('studentName').value.trim();
    if (!nameInput) {
      alert('Prosím, zadajte svoje meno! (Kérjük, adja meg a nevét!)');
      return;
    }

    currentStudent = nameInput;
    const textCount = parseInt(document.getElementById('textCount').value);
    const taskMode = document.getElementById('taskMode').value;

    document.getElementById('displayName').innerText = `Študent: ${currentStudent}`;
    document.getElementById('displayDetails').innerText = `Ukážky: ${textCount} | Režim: ${getModeLabel(taskMode)}`;
    
    document.getElementById('startPanel').style.display = 'none';
    document.getElementById('testArea').style.display = 'block';

    userAnswers = {};
    secondsElapsed = 0;
    startTimer();
    generateContent(textCount, taskMode);
  }

  function getModeLabel(mode) {
    if (mode === 'reading') return 'Čítanie';
    if (mode === 'grammar') return 'Gramatika';
    return 'Zmiešaný';
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('timer').innerText = `Čas: ${mins}:${secs}`;
    }, 1000);
  }

  function generateContent(textCount, taskMode) {
    const container = document.getElementById('dynamicContent');
    container.innerHTML = '';
    activeTasks = [];
    let globalTaskIndex = 1;

    const selectedTexts = database.slice(0, textCount);

    selectedTexts.forEach((item, index) => {
      // Olvasmány kártya
      const readingCard = document.createElement('div');
      readingCard.className = 'reading-card';
      readingCard.innerHTML = `
        <div class="reading-header">Ukážka ${index + 1}</div>
        <div class="reading-content">
          <div class="author">${item.author}</div>
          <h3>${item.title}</h3>
          ${item.text}
        </div>
      `;
      container.appendChild(readingCard);

      // Feladatok kiszűrése mód szerint
      let filteredTasks = item.tasks;
      if (taskMode === 'reading') filteredTasks = item.tasks.filter(t => t.type === 'reading');
      else if (taskMode === 'grammar') filteredTasks = item.tasks.filter(t => t.type === 'grammar');

      if (filteredTasks.length > 0) {
        const sectionTitle = document.createElement('div');
        sectionTitle.className = 'section-title';
        sectionTitle.innerText = `Na ukážku ${index + 1} sa vzťahujú úlohy ${globalTaskIndex} – ${globalTaskIndex + filteredTasks.length - 1}`;
        container.appendChild(sectionTitle);

        filteredTasks.forEach(task => {
          const currentNumber = globalTaskIndex++;
          const taskObj = { ...task, displayId: currentNumber };
          activeTasks.push(taskObj);

          const card = document.createElement('div');
          card.className = 'task-card';
          card.id = `task-card-${currentNumber}`;

          let html = `
            <div>
              <span class="task-number">${currentNumber}.</span>
              <div class="task-question">${task.question}</div>
            </div>
          `;

          if (task.qType === 'mc') {
            html += `<div class="options-grid">`;
            task.options.forEach(opt => {
              html += `
                <div class="option-item" id="opt-${currentNumber}-${opt.key}" onclick="selectOption(${currentNumber}, '${opt.key}')">
                  <div class="option-circle">${opt.key}</div>
                  <div>${opt.text}</div>
                </div>
              `;
            });
            html += `</div>`;
          } else if (task.qType === 'input') {
            html += `
              <div class="input-task-container">
                <input type="text" class="input-line" id="input-${currentNumber}" 
                       placeholder="Tvoja odpoveď..." oninput="saveInputAnswer(${currentNumber})">
              </div>
            `;
          }

          html += `<div class="feedback-text" id="feedback-${currentNumber}"></div>`;
          card.innerHTML = html;
          container.appendChild(card);
        });
      }
    });
  }

  function selectOption(taskId, key) {
    userAnswers[taskId] = key;
    const task = activeTasks.find(t => t.displayId === taskId);
    task.options.forEach(opt => {
      const el = document.getElementById(`opt-${taskId}-${opt.key}`);
      if (opt.key === key) el.classList.add('selected');
      else el.classList.remove('selected');
    });
  }

  function saveInputAnswer(taskId) {
    const val = document.getElementById(`input-${taskId}`).value.trim();
    userAnswers[taskId] = val;
  }

  function calculateGrade(percentage) {
    if (percentage >= 90) return 1;
    if (percentage >= 75) return 2;
    if (percentage >= 50) return 3;
    if (percentage >= 32) return 4;
    return 5;
  }

  function evaluateTest() {
    clearInterval(timerInterval);
    let correctCount = 0;
    const totalCount = activeTasks.length;

    activeTasks.forEach(task => {
      const card = document.getElementById(`task-card-${task.displayId}`);
      const feedback = document.getElementById(`feedback-${task.displayId}`);
      const userAns = userAnswers[task.displayId];
      let isCorrect = false;

      if (task.qType === 'mc') {
        if (userAns === task.correct) isCorrect = true;
      } else if (task.qType === 'input') {
        if (userAns && task.correct.some(c => c.toLowerCase() === userAns.toLowerCase())) {
          isCorrect = true;
        }
      }

      if (isCorrect) {
        correctCount++;
        card.className = 'task-card correct';
        feedback.className = 'feedback-text correct';
        feedback.innerText = '✓ Správne (Helyes)';
      } else {
        card.className = 'task-card incorrect';
        feedback.className = 'feedback-text incorrect';
        const correctDisplay = task.qType === 'mc' ? task.correct : task.correct[0];
        feedback.innerText = `✗ Nesprávne. Správna odpoveď: ${correctDisplay}`;
      }
    });

    const percentage = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
    const grade = calculateGrade(percentage);

    const resultObj = {
      date: new Date().toLocaleDateString('sk-SK') + ' ' + new Date().toLocaleTimeString('sk-SK', {hour:'2-digit', minute:'2-digit'}),
      name: currentStudent,
      score: `${correctCount} / ${totalCount}`,
      percentage: percentage,
      grade: grade,
      duration: secondsElapsed
    };

    testHistory.push(resultObj);
    localStorage.setItem('t9_test_history', JSON.stringify(testHistory));

    document.getElementById('submitBtn').disabled = true;
    showResultsModal(resultObj);
  }

  function showResultsModal(currentResult) {
    const body = document.getElementById('modalBody');
    const mins = Math.floor(currentResult.duration / 60);
    const secs = currentResult.duration % 60;

    body.innerHTML = `
      <div class="stats-card">
        <div class="stats-item">
          <h4>Meno / Név</h4>
          <p>${currentResult.name}</p>
        </div>
        <div class="stats-item">
          <h4>Skóre / Pont</h4>
          <p>${currentResult.score}</p>
        </div>
        <div class="stats-item">
          <h4>Úspešnosť / %</h4>
          <p>${currentResult.percentage}%</p>
        </div>
        <div class="stats-item">
          <h4>Známka / Osztályzat</h4>
          <p>${currentResult.grade}</p>
        </div>
        <div class="stats-item">
          <h4>Čas / Eltelt idő</h4>
          <p>${mins}m ${secs}s</p>
        </div>
      </div>
      
      <h3>História testov (Előző kitöltések):</h3>
      ${renderHistoryTable()}
    `;

    document.getElementById('historyModal').style.display = 'flex';
  }

  function renderHistoryTable() {
    if (testHistory.length === 0) return '<p>Žiadne záznamy.</p>';
    let html = `
      <table class="history-table">
        <thead>
          <tr>
            <th>Dátum</th>
            <th>Meno</th>
            <th>Skóre</th>
            <th>%</th>
            <th>Známka</th>
            <th>Čas</th>
          </tr>
        </thead>
        <tbody>
    `;

    testHistory.slice().reverse().forEach(h => {
      const m = Math.floor(h.duration / 60);
      const s = h.duration % 60;
      html += `
        <tr>
          <td>${h.date}</td>
          <td>${h.name}</td>
          <td>${h.score}</td>
          <td>${h.percentage}%</td>
          <td><b>${h.grade}</b></td>
          <td>${m}m ${s}s</td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    return html;
  }

  function openHistoryModal() {
    const body = document.getElementById('modalBody');
    body.innerHTML = `
      <h3>História výsledkov (Gyakorlásom eredményei):</h3>
      ${renderHistoryTable()}
      <div style="margin-top: 15px;">
        <button class="btn btn-secondary no-print" onclick="clearHistory()">Vymazať históriu (Törlés)</button>
      </div>
    `;
    document.getElementById('historyModal').style.display = 'flex';
  }

  function closeHistoryModal() {
    document.getElementById('historyModal').style.display = 'none';
  }

  function clearHistory() {
    if (confirm('Naozaj chcete vymazať históriu?')) {
      testHistory = [];
      localStorage.removeItem('t9_test_history');
      openHistoryModal();
    }
  }
</script>
</body>
</html>
