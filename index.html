<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testovanie 9 – Slovenský jazyk a slovenská literatúra</title>
  <style>
    :root {
      --primary-orange: #f58220;
      --light-orange: #fff8f2;
      --border-orange: #fca34d;
      --dark-text: #2c3e50;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --success: #2e7d32;
      --success-bg: #e8f5e9;
      --error: #c62828;
      --error-bg: #ffebee;
      --border-gray: #dcdfe6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--dark-text); padding: 20px; display: flex; justify-content: center; }
    .app-container { max-width: 950px; width: 100%; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 25px; }

    header { text-align: center; margin-bottom: 25px; border-bottom: 3px solid var(--primary-orange); padding-bottom: 15px; }
    header h1 { color: var(--primary-orange); font-size: 1.8rem; margin-bottom: 5px; }
    header p { color: #666; font-size: 0.95rem; }

    .start-panel { background: var(--light-orange); border: 2px solid var(--border-orange); border-radius: 10px; padding: 20px; margin-bottom: 25px; }
    .form-group { margin-bottom: 15px; max-width: 500px; margin-left: auto; margin-right: auto; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border-gray); border-radius: 6px; font-size: 1rem; background: #fff; }
    .button-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }

    .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s ease; }
    .btn-orange { background: var(--primary-orange); color: white; }
    .btn-orange:hover { background: #e06d0b; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5a6268; }
    .btn-danger { background: #c62828; color: white; }
    .btn-danger:hover { background: #a31f1f; }

    .timer-bar { display: flex; justify-content: space-between; align-items: center; background: #eee; padding: 10px 20px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; }

    .reading-card { border: 2px solid var(--border-orange); border-radius: 10px; background: var(--light-orange); margin-bottom: 30px; overflow: hidden; }
    .reading-header { background: var(--border-orange); color: white; padding: 10px 15px; font-weight: bold; font-size: 1.1rem; }
    .reading-content { padding: 20px; line-height: 1.6; font-size: 0.98rem; }
    .reading-content h3 { text-align: center; margin-bottom: 10px; color: var(--primary-orange); }
    .reading-content .author { text-align: center; font-style: italic; margin-bottom: 15px; }

    .section-title { text-align: center; font-size: 1.2rem; font-weight: bold; margin: 25px 0 15px 0; color: var(--dark-text); border-bottom: 2px dotted #ccc; padding-bottom: 5px; }
    .task-card { border: 2px solid var(--border-orange); border-radius: 10px; padding: 15px 20px; margin-bottom: 20px; background: #fff; }
    .task-number { display: inline-block; background: var(--border-orange); color: white; font-weight: bold; padding: 3px 8px; border-radius: 5px; margin-right: 10px; font-size: 1rem; }
    .task-question { font-size: 1.05rem; font-weight: bold; display: inline; line-height: 1.5; }

    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
    .option-item { display: flex; align-items: center; padding: 8px 12px; border: 1px solid var(--border-gray); border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    .option-item:hover { background: #f8f9fa; }
    .option-circle { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--primary-orange); color: var(--primary-orange); display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px; flex-shrink: 0; }
    .option-item.selected { border-color: var(--primary-orange); background: var(--light-orange); }
    .option-item.selected .option-circle { background: var(--primary-orange); color: white; }

    .input-task-container { margin-top: 15px; }
    .input-line { width: 100%; max-width: 500px; border: none; border-bottom: 2px solid var(--dark-text); padding: 8px 5px; font-size: 1.1rem; outline: none; background: transparent; }
    .input-line:focus { border-bottom-color: var(--primary-orange); }

    .task-card.correct { border-color: var(--success); background-color: var(--success-bg); }
    .task-card.incorrect { border-color: var(--error); background-color: var(--error-bg); }
    .feedback-box { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 0.95rem; }
    .feedback-box.correct { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .feedback-box.incorrect { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .explanation { margin-top: 6px; font-style: italic; font-size: 0.9rem; color: #333; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px; border-radius: 10px; max-width: 750px; width: 90%; max-height: 85vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-gray); padding-bottom: 10px; margin-bottom: 15px; }
    .stats-card { background: var(--light-orange); border: 1px solid var(--border-orange); border-radius: 8px; padding: 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; text-align: center; margin-bottom: 20px; }
    .stats-item h4 { font-size: 0.8rem; color: #666; text-transform: uppercase; }
    .stats-item p { font-size: 1.2rem; font-weight: bold; color: var(--primary-orange); }
    .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .history-table th, .history-table td { border: 1px solid var(--border-gray); padding: 8px; font-size: 0.85rem; text-align: left; }
    .history-table th { background: #f4f6f9; }

    @media print {
      body * { visibility: hidden; }
      #printableArea, #printableArea * { visibility: visible; }
      #printableArea { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>Testovanie 9 – Monitor 9</h1>
    <p>Slovenský jazyk a slovenská literatúra – Generátor testov</p>
  </header>

  <!-- BEÁLLÍTÁSOK -->
  <div class="start-panel" id="startPanel">
    <h2 style="text-align: center; margin-bottom: 15px;">Nastavenia testu</h2>
    
    <div class="form-group">
      <label for="studentName">Meno študenta (Tanuló neve):</label>
      <input type="text" id="studentName" placeholder="napr. Adam Tóth">
    </div>

    <div class="form-group">
      <label for="textCount">Počet ukážok (Szövegek száma):</label>
      <select id="textCount">
        <option value="1">1 ukážka (1 szöveg + 6 kérdés)</option>
        <option value="2">2 ukážky (2 szöveg + 12 kérdés)</option>
        <option value="3">3 ukážky (3 szöveg + 18 kérdés)</option>
        <option value="4" selected>4 ukážky (4 szöveg + 24 kérdés – Teljes teszt)</option>
      </select>
    </div>

    <div class="button-group">
      <button class="btn btn-orange" onclick="startTest()">Začať nový test (Új teszt indítása)</button>
      <button class="btn btn-secondary" onclick="openHistoryModal()">Gyakorlásom & Statisztika</button>
      <button class="btn btn-danger" onclick="clearHistory()">Vymazať štatistiku (Statisztika törlése)</button>
    </div>
  </div>

  <!-- TESZT TERÜLET -->
  <div id="testArea" style="display: none;">
    <div class="timer-bar">
      <span id="displayName">Študent: -</span>
      <span id="displayDetails">Ukážky: -</span>
      <span id="timer">Čas: 00:00</span>
    </div>

    <div id="dynamicContent"></div>

    <div style="text-align: center; margin: 30px 0;">
      <button class="btn btn-orange" id="submitBtn" onclick="evaluateTest()" style="font-size: 1.2rem; padding: 12px 30px;">
        VYHODNOTIŤ TEST (ELLENŐRZÉS)
      </button>
    </div>
  </div>
</div>

<!-- MODÁLIS ABLAK -->
<div id="historyModal" class="modal">
  <div class="modal-content" id="printableArea">
    <div class="modal-header">
      <h2 id="modalTitle">Výsledky a Štatistika / Gyakorlásom</h2>
      <button class="btn btn-secondary no-print" onclick="closeHistoryModal()">✕</button>
    </div>
    
    <div id="modalBody"></div>

    <div class="no-print" style="margin-top: 20px; text-align: right;">
      <button class="btn btn-orange" onclick="window.print()">Vytlačiť / Nyomtatás PDF</button>
      <button class="btn btn-secondary" onclick="closeHistoryModal()">Zatvoriť (Bezárás)</button>
    </div>
  </div>
</div>

<script>
  const getRandomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  const shuffleArray = (arr) => arr.slice().sort(() => Math.random() - 0.5);

  /* ==========================================
     1. DINAMIKUS SZÖVEGGENERÁTOR (12-22 MONDAT)
     ========================================== */
  function generateDynamicText() {
    const categories = ['fairy', 'history', 'encyclopedia', 'biography'];
    const chosenCategory = getRandomItem(categories);
    const targetSentenceCount = getRandomInt(12, 22);
    let sentences = [];
    let title = "";
    let author = "";

    if (chosenCategory === 'fairy') {
      const heroes = ['Odvážny Janko', 'Čarovný jeleň', 'Rytier Oliver', 'Múdra princezná'];
      const hero = getRandomItem(heroes);
      title = `Rozprávka o hrdinovi ${hero}`;
      author = 'Ľudová povesť';

      sentences = [
        `Kde bolo, tam bolo, za siedmimi horami žil odvážny hrdina menom ${hero}.`,
        `Všetci obyvatelia v blízkej dedine ho poznali pre jeho nesmiernu obetavosť a dobré srdce.`,
        `Jedného dňa sa nad celou krajinou objavili tmavé mraky a slnko prestalo svietiť.`,
        `Starý dedinský mudrc prezradil, že kúzlo môže zlomiť len ten, kto nájde stratený prameň.`,
        `${hero} sa bez váhania zbalil, vzal si na cestu kúsok chleba a vydal sa do neznáma.`,
        `Jeho cesta viedla cez hustý a temný les, kde stromy šepkali tajomné záhady.`,
        `Na druhej strane lesa stretol rozprávkovú babičku, ktorá niesla ťažké drevo.`,
        `Mladík jej ochotne pomohol, a tak mu babička darovala čarovný zlatý kľúčik.`,
        `Tento kľúčik dokázal otvoriť každú zamknutú bránu a odhaliť skryté tajomstvá.`,
        `Po troch dňoch putovania sa pred ním konečne zjavila vysoká sklenená hora.`,
        `Na samotnom vrchole hory stála stará truhlica, v ktorej sa ukrývalo stratené svetlo.`,
        `${hero} opatrne vložil kľúč do zámky a truhlicu celkom ľahko otvoril.`,
        `Hrejivé slnečné lúče v tom momente opäť zaliali celú krajinu a zahnali temnotu.`,
        `Všetci ľudia v kráľovstve sa radovali, spievali a usporiadali veľkú slávnosť.`,
        `Náš hrdina dostal za svoju odvahu kráľovskú odmenu a veľkú úctu všetkých občanov.`,
        `Od tých čias žili všetci obyvatelia v mieri, blahobyte a vzájomnej svornosti.`,
        `Každý rok si pripomínali tento slávny deň veľkým festivalom plným hudby a tanca.`,
        `Strelci a rytieri na slávnosti predvádzali svoje najlepšie kúsky a umenie.`,
        `Deti počúvali rozprávanie o tomto hrdinskom čine s otvorenými ústami.`,
        `Múdrosť a odvaha sa tak stali hlavnými hodnotami celého nového kráľovstva.`,
        `A ak tam nežijú dodnes, tak tam určite bývajú a spomínajú na túto udalosť.`,
        `Tento príbeh sa traduje z generácie na generáciu ako dôkaz sily ľudského dobra.`
      ];
    } else if (chosenCategory === 'history') {
      const events = ['Bitka pri Trenčíne', 'Stavba starobylého hradu', 'Založenie prvej univerzity', 'Cisárska návšteva'];
      const event = getRandomItem(events);
      title = `Historická udalosť: ${event}`;
      author = 'Historický archív';

      sentences = [
        `História nášho regiónu ukrýva mnohé tajomstvá, ktoré priťahujú pozornosť vedcov.`,
        `Práve udalosti okolo témy "${event}" výrazne ovplyvnili ďalší vývoj krajiny.`,
        `Všetko sa začalo v chladnom jesennom ráne, kedy panovník vydal dôležitý rozkaz.`,
        `Vojská a obyvatelia mesta sa museli rýchlo pripraviť na nečakané zmeny.`,
        `Správy o tejto udalosti sa rýchlo rozšírili do všetkých okolitých dedín.`,
        `Miestni kronikári podrobne zaznamenali každý dôležitý detail do pamätných kníh.`,
        `Stavitelia a remeselníci pracovali dňom i nocou, aby splnili požiadavky dvora.`,
        `Mnohé rodiny priniesli veľké obete, aby pomohli obrániť svoje domovy.`,
        `Po mesiacoch neistoty sa napokon situácia upokojila a priniesla dlho očakávaný mier.`,
        `Výsledky týchto historických rozhodnutí môžeme pozorovať v meste až dodnes.`,
        `Archeológovia nedávno objavili nové dôkazy, ktoré potvrdzujú presnosť správ.`,
        `Vzácne artefakty z tohto obdobia sú dnes uložené v národnom múzeu.`,
        `Odborníci dodnes diskutujú o presnom časovom priebehu tejto veľkej udalosti.`,
        `Školské výpravy pravidelne navštevujú miesta, kde sa písali tieto kapitoly dejín.`,
        `Pripomínanie si histórie pomáha mladým ľuďom lepšie pochopiť súčasný svet.`,
        `Hradné múry dodnes stoja ako nemí svedkovia dávnej slávy a hrdinstva predkov.`,
        `Mnohí turisti prichádzajú zo zahraničia, aby videli tieto unikátne pamiatky.`,
        `Miestna samospráva investuje značné prostriedky do obnovy historických objektov.`,
        `Každoročné rekonštrukcie bojov lákajú tisíce nadšených divákov z celého okolia.`,
        `Historické dokumenty sú starostlivo chránené v digitalizovanej podobe v archíve.`,
        `Výskum v tejto oblasti stále pokračuje a prináša nové prekvapujúce zistenia.`,
        `Tieto udalosti zostanú trvalou súčasťou našej národnej identity a dedičstva.`
      ];
    } else if (chosenCategory === 'encyclopedia') {
      const topics = ['Slnečná sústava a planéty', 'Život v hlbokých oceánoch', 'Slovenské národné parky', 'Umelá inteligencia'];
      const topic = getRandomItem(topics);
      title = `Encyklopédia: ${topic}`;
      author = 'Vedecko-populárny časopis';

      sentences = [
        `Svet okolo nás je plný fascinujúcich javov a nepreskúmaných tajomstiev.`,
        `Téma "${topic}" patrí medzi najatraktívnejšie oblasti modernej výskumnej vedy.`,
        `Vedecké objavy posledných desaťročí zásadne zmenili náš pohľad na túto problematiku.`,
        `Odborníci z celého sveta spájajú svoje sily, aby získali nové presné dáta.`,
        `Použitie moderných technológií umožňuje skúmať aj tie najmenšie detaily procesov.`,
        `Príroda a technológie sa v tomto bode pretínajú a vytvárajú unikátne synergie.`,
        `Mnohé merania ukazujú, že zmeny v tomto systéme prebiehajú rýchlejšie ako v minulosti.`,
        `Pre správne pochopenie je potrebné analyzovať množstvo vzoriek a štatistík.`,
        `Študenti sa s týmito základnými princípmi zoznamujú už na základných školách.`,
        `Publikované štúdie potvrdzujú, že ochrana a výskum majú kľúčový význam pre budúcnosť.`,
        `Laboratórne experimenty prinášajú neustále nové odpovede na staré otázky.`,
        `Medzinárodné tímy spolupracujú na projektoch, ktoré majú globálny dosah.`,
        `Verejnosť prejavuje čoraz väčší záujem o prednášky a dokumentárne filmy.`,
        `Vzdelávanie v tejto oblasti otvára dvere k novým technologickým inováciám.`,
        `Je dôležité zachovať rovnováhu medzi ľudským pokrokom a prírodným prostredím.`,
        `Budúce generácie budú pravdepodobne čeliť úplne novým výzvam v tejto sfére.`,
        `Počítačové simulácie pomáhajú predpovedať vývoj na niekoľko rokov dopredu.`,
        `Mnohé univerzity ponúkajú špecializované študijné programy zamerané na túto tému.`,
        `Financovanie výskumu pochádza zo štátnych grantov aj súkromných zdrojov.`,
        `Výsledky bádania sú pravidelne prezentované na medzinárodných konferenciách.`,
        `Každý nový objav nás približuje k hlbšiemu pochopeniu základných zákonitostí.`,
        `Poznanie je kľúčom k udržateľnému rozvoju a prosperite celej našej spoločnosti.`
      ];
    } else { // biography
      const figures = ['Ľudovít Štúr', 'Pavol Országh Hviezdoslav', 'Milan Rastislav Štefánik', 'Aureľ Stodola'];
      const figure = getRandomItem(figures);
      title = `Biografia: ${figure}`;
      author = 'Literárny a historický lexikón';

      sentences = [
        `${figure} patrí medzi najvýznamnejšie osobnosti slovenskej histórie a kultúry.`,
        `Narodil sa v rodine, kde sa kladol veľký dôraz na vzdelanie a národné hodnoty.`,
        `Už počas svojich študijných čias vynikal mimoriadnym talentom a usilovnosťou.`,
        `Precestoval mnohé krajiny Európy, kde získal cenné skúsenosti a kontakty.`,
        `Jeho tvorba a práca ovplyvnili celú generáciu jeho súčasníkov a nasledovníkov.`,
        `Nekompromisne presadzoval svoje myšlienky a bojoval za práva svojho národa.`,
        `Napísal nespočetné množstvo významných diel, článkov a vedeckých štúdií.`,
        `Jeho osobný život bol plný nečakaných zvratov, obiet a ťažkých skúšok.`,
        `Spolupracoval s najvýznamnejšími učencami a politikmi svojej vtedajšej doby.`,
        `Jeho diela boli preložené do viacerých cudzích jazykov a získali uznanie v zahraničí.`,
        `Pamätníci ho opisovali ako človeka s obrovskou charizmou a pevnou vôľou.`,
        `Počas svojho života získal mnohé ocenenia a pocty za svoje zásluhy.`,
        `Jeho odkaz je stále živý a inšpiruje umelcov i vedcov aj v dnešnej dobe.`,
        `Školy, ulice a kultúrne inštitúcie po celom kraji nesú s hrdosťou jeho meno.`,
        `Historici neustále objavujú novú korešpondenciu a zápisky z jeho pozostalosti.`,
        `Múzeum venované jeho životu navštevujú ročne desiatky tisíc návštevníkov.`,
        `V jeho rodnom dome bola zriadená stála expozícia s osobnými predmetmi.`,
        `Pri príležitosti výročí jeho narodenia sa konajú spomienkové slávnosti.`,
        `Jeho prínos pre rozvoj vedy a kultúry je jednoducho nezmazateľný.`,
        `O jeho živote bolo napísaných niekoľko knižných monografií a natočených filmov.`,
        `Štúdium jeho diela zostáva dôležitou súčasťou školských učebných osnov.`,
        `Jeho životný príbeh je príkladom odhodlania, pracovitosti a lásky k vlasti.`
      ];
    }

    return {
      category: chosenCategory,
      title,
      author,
      sentences: sentences.slice(0, targetSentenceCount)
    };
  }

  /* ==========================================
     2. DYNAMICKÝ GENERÁTOR RÔZNORODÝCH OTÁZOK (MONITOR 9)
     ========================================== */
  function generateQuestionsForText(generatedData) {
    const s = generatedData.sentences;
    const len = s.length;
    let questions = [];

    // TÍPUS 1: Hlavná myšlienka / Zameranie textu
    const mainIdeaQ = {
      qType: 'mc',
      question: `Čo je hlavnou témou alebo cieľom ukážky s názvom <i>"${generatedData.title}"</i>?`,
      options: shuffleArray([
        { key: 'A', text: `Sprostredkovať informácie a poznatky týkajúce sa: ${generatedData.title}.` },
        { key: 'B', text: `Kritizovať moderné technológie a ich nepriaznivý vplyv na mládež.` },
        { key: 'C', text: `Poskytnúť podrobný návod na varenie tradičných jedál.` },
        { key: 'D', text: `Podať geografický opis pohorí v severnej Amerike.` }
      ]),
      explanation: `Text sa od začiatku celostne venuje téme "${generatedData.title}".`
    };
    // Nastavenie kľúča pre správnu odpoveď
    mainIdeaQ.correct = mainIdeaQ.options.find(o => o.text.includes(generatedData.title)).key;
    questions.push(mainIdeaQ);

    // TÍPUS 2: Pravdivé tvrdenie podľa konkrétnej vety (Pravdivé / Nepravdivé)
    const targetIdx = getRandomInt(1, Math.min(len, 6)) - 1;
    const trueSentence = s[targetIdx];
    const trueQ = {
      qType: 'mc',
      question: `Ktoré z nasledujúcich tvrdení je <u>PRAVDIVÉ</u> na základe vety č. ${targetIdx + 1}?`,
      options: shuffleArray([
        { key: 'A', text: `${trueSentence}` },
        { key: 'B', text: `Veta č. ${targetIdx + 1} hovorí o úplne inom objave v minulom storočí.` },
        { key: 'C', text: `Tento fakt bol podľa textu vyvrátený vedcami v roku 1999.` },
        { key: 'D', text: `Autor ukážky spochybňuje pravdivosť informácie vo vete č. ${targetIdx + 1}.` }
      ]),
      explanation: `Tvrdenie je doslovne uvedené vo vete č. ${targetIdx + 1}.`
    };
    trueQ.correct = trueQ.options.find(o => o.text === trueSentence).key;
    questions.push(trueQ);

    // TÍPUS 3: Čo vyplýva z textu / Vyplývanie (Implikácia)
    const targetIdx2 = getRandomInt(Math.floor(len / 2), len - 1);
    const impliedSentence = s[targetIdx2];
    const implyQ = {
      qType: 'mc',
      question: `Čo priamo <u>VYPLÝVA</u> z vety č. ${targetIdx2 + 1}: <i>"${impliedSentence}"</i>?`,
      options: shuffleArray([
        { key: 'A', text: `Informácia uvedená vo vete má priamy súvis s celkovým kontextom ukážky.` },
        { key: 'B', text: `Veta vyjadruje nesúhlas autora s vyučovaním na školách.` },
        { key: 'C', text: `Informácia vo vete je v priamom rozpore s prvou vetou ukážky.` },
        { key: 'D', text: `Z vety jednoznačne vyplýva, že udalosť sa stala v noci.` }
      ]),
      explanation: `Veta č. ${targetIdx2 + 1} prirodzene dopĺňa kontext a tému textu.`
    };
    implyQ.correct = implyQ.options.find(o => o.text.includes('priamy súvis')).key;
    questions.push(implyQ);

    // TÍPUS 4: Szinonimák / Ellentétek a szövegben (Synonymá / Antonymá)
    const synPairs = [
      { word: 'odvážny', syn: 'neohrozený / hrdinský', ant: 'bojazlivý' },
      { word: 'významné', syn: 'dôležité / podstatné', ant: 'bezvýznamné' },
      { word: 'fascinujúce', syn: 'pútavé / úžasné', ant: 'nositeľné / nudné' },
      { word: 'úsilie', syn: 'snaha / námaha', ant: 'pasivita' }
    ];
    const selectedPair = getRandomItem(synPairs);
    const synQ = {
      qType: 'mc',
      question: `V ktorej možnosti je uvedené vhodné <b>SYNONYMUM</b> (slovo s rovnakým/podobným významom) k slovu <i>"${selectedPair.word}"</i>?`,
      options: shuffleArray([
        { key: 'A', text: `${selectedPair.syn}` },
        { key: 'B', text: `${selectedPair.ant}` },
        { key: 'C', text: `zbytočné / neplatné` },
        { key: 'D', text: `vedľajšie / neznáme` }
      ]),
      explanation: `Slovo "${selectedPair.word}" má rovnaký alebo blízky význam ako "${selectedPair.syn}".`
    };
    synQ.correct = synQ.options.find(o => o.text === selectedPair.syn).key;
    questions.push(synQ);

    // TÍPUS 5: Helyes szókapcsolat / Nyelvtani alak a szövegből (podľa obrázka č. 13-15)
    const grammQ = {
      qType: 'mc',
      question: `V ktorej z nasledujúcich možností je uvedené <u>GRAMATICKY A PRAVOPISNE SPRÁVNE</u> slovné spojenie?`,
      options: shuffleArray([
        { key: 'A', text: `s novými významnými objavmi` },
        { key: 'B', text: `s novými významnými objavmy` },
        { key: 'C', text: `s novími významnými objavmi` },
        { key: 'D', text: `s novými významnýmy objavmi` }
      ]),
      explanation: `Správny pravopis je "s novými významnými objavmi" (inštrumentál množného čísla, vzor pekný a dub/stroj).`
    };
    grammQ.correct = grammQ.options.find(o => o.text === 's novými významnými objavmi').key;
    questions.push(grammQ);

    // TÍPUS 6: Nyílt kérdés – Podmet / Slovo z textu (podľa obrázka č. 16-17)
    const sampleSentence = s[0];
    const words = sampleSentence.split(' ').map(w => w.replace(/[^a-zA-ZáäčďéíĺľňóôŕšťúýžÁÄČĎÉÍĹĽŇÓÔŔŠŤÚÝŽ]/g, ""));
    const firstWord = words[0];
    const openQ = {
      qType: 'input',
      question: `Vypíš prvé slovo z vety č. 1 v tejto ukážke (<i>"${sampleSentence}"</i>):`,
      correct: [firstWord, firstWord.toLowerCase()],
      explanation: `Prvé slovo vety č. 1 je "${firstWord}".`
    };
    questions.push(openQ);

    return shuffleArray(questions);
  }

  /* ==========================================
     3. TESZT LOGIKA, MEGJELENÍTÉS ÉS STATISZTIKA
     ========================================== */
  let activeTasks = [];
  let userAnswers = {};
  let timerInterval = null;
  let secondsElapsed = 0;
  let currentStudent = '';
  let testHistory = JSON.parse(localStorage.getItem('t9_test_history_v6')) || [];

  function startTest() {
    const nameInput = document.getElementById('studentName').value.trim();
    if (!nameInput) {
      alert('Prosím, zadajte svoje meno!');
      return;
    }

    currentStudent = nameInput;
    const textCount = parseInt(document.getElementById('textCount').value);

    document.getElementById('displayName').innerText = `Študent: ${currentStudent}`;
    document.getElementById('displayDetails').innerText = `Ukážky: ${textCount} (${textCount * 6} úloh)`;
    
    document.getElementById('startPanel').style.display = 'none';
    document.getElementById('testArea').style.display = 'block';

    userAnswers = {};
    secondsElapsed = 0;
    startTimer();
    generateTestPaper(textCount);
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('timer').innerText = `Čas: ${mins}:${secs}`;
    }, 1000);
  }

  function generateTestPaper(textCount) {
    const container = document.getElementById('dynamicContent');
    container.innerHTML = '';
    activeTasks = [];
    let globalTaskIndex = 1;

    for (let i = 0; i < textCount; i++) {
      const generatedData = generateDynamicText();
      const sentences = generatedData.sentences;
      
      const readingCard = document.createElement('div');
      readingCard.className = 'reading-card';
      readingCard.innerHTML = `
        <div class="reading-header">Ukážka ${i + 1} (Počet viet: ${sentences.length})</div>
        <div class="reading-content">
          <div class="author">${generatedData.author}</div>
          <h3>${generatedData.title}</h3>
          ${sentences.map((s, idx) => `<p><b>[${idx + 1}]</b> ${s}</p>`).join('')}
        </div>
      `;
      container.appendChild(readingCard);

      const questions = generateQuestionsForText(generatedData);

      const sectionTitle = document.createElement('div');
      sectionTitle.className = 'section-title';
      sectionTitle.innerText = `Úlohy k Ukážke ${i + 1} (Úlohy ${globalTaskIndex} – ${globalTaskIndex + questions.length - 1})`;
      container.appendChild(sectionTitle);

      questions.forEach(task => {
        const taskNum = globalTaskIndex++;
        const taskObj = { ...task, displayId: taskNum };
        activeTasks.push(taskObj);
        renderTaskCard(container, taskObj, taskNum);
      });
    }
  }

  function renderTaskCard(container, task, taskNum) {
    const card = document.createElement('div');
    card.className = 'task-card';
    card.id = `task-card-${taskNum}`;

    let html = `
      <div>
        <span class="task-number">${taskNum}.</span>
        <div class="task-question">${task.question}</div>
      </div>
    `;

    if (task.qType === 'mc') {
      html += `<div class="options-grid">`;
      task.options.forEach(opt => {
        html += `
          <div class="option-item" id="opt-${taskNum}-${opt.key}" onclick="selectOption(${taskNum}, '${opt.key}')">
            <div class="option-circle">${opt.key}</div>
            <div>${opt.text}</div>
          </div>
        `;
      });
      html += `</div>`;
    } else if (task.qType === 'input') {
      html += `
        <div class="input-task-container">
          <input type="text" class="input-line" id="input-${taskNum}" 
                 placeholder="Tvoja odpoveď..." oninput="saveInputAnswer(${taskNum})">
        </div>
      `;
    }

    html += `<div id="feedback-${taskNum}"></div>`;
    card.innerHTML = html;
    container.appendChild(card);
  }

  function selectOption(taskId, key) {
    userAnswers[taskId] = key;
    const task = activeTasks.find(t => t.displayId === taskId);
    if (task && task.options) {
      task.options.forEach(opt => {
        const el = document.getElementById(`opt-${taskId}-${opt.key}`);
        if (el) {
          if (opt.key === key) el.classList.add('selected');
          else el.classList.remove('selected');
        }
      });
    }
  }

  function saveInputAnswer(taskId) {
    const val = document.getElementById(`input-${taskId}`).value.trim();
    userAnswers[taskId] = val;
  }

  function calculateGrade(percentage) {
    if (percentage >= 90) return 1;
    if (percentage >= 75) return 2;
    if (percentage >= 50) return 3;
    if (percentage >= 32) return 4;
    return 5;
  }

  function evaluateTest() {
    clearInterval(timerInterval);
    let correctCount = 0;
    const totalCount = activeTasks.length;

    activeTasks.forEach(task => {
      const card = document.getElementById(`task-card-${task.displayId}`);
      const feedback = document.getElementById(`feedback-${task.displayId}`);
      const userAns = userAnswers[task.displayId];
      let isCorrect = false;

      if (task.qType === 'mc') {
        if (userAns === task.correct) isCorrect = true;
      } else if (task.qType === 'input') {
        if (userAns && task.correct.some(c => c.toLowerCase() === userAns.toLowerCase())) {
          isCorrect = true;
        }
      }

      const correctDisplay = task.qType === 'mc' ? task.correct : task.correct[0];

      if (isCorrect) {
        correctCount++;
        card.className = 'task-card correct';
        feedback.innerHTML = `
          <div class="feedback-box correct">
            <strong>✓ Správne! (Helyes)</strong>
            <div class="explanation"><b>Vysvetlenie:</b> ${task.explanation}</div>
          </div>
        `;
      } else {
        card.className = 'task-card incorrect';
        feedback.innerHTML = `
          <div class="feedback-box incorrect">
            <strong>✗ Nesprávne.</strong> Správna odpoveď: <b>${correctDisplay}</b>
            <div class="explanation"><b>Vysvetlenie:</b> ${task.explanation}</div>
          </div>
        `;
      }
    });

    const percentage = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
    const grade = calculateGrade(percentage);

    const resultObj = {
      date: new Date().toLocaleDateString('sk-SK') + ' ' + new Date().toLocaleTimeString('sk-SK', {hour:'2-digit', minute:'2-digit'}),
      name: currentStudent,
      score: `${correctCount} / ${totalCount}`,
      percentage: percentage,
      grade: grade,
      duration: secondsElapsed
    };

    testHistory.push(resultObj);
    localStorage.setItem('t9_test_history_v6', JSON.stringify(testHistory));

    document.getElementById('submitBtn').disabled = true;
    showResultsModal(resultObj);
  }

  /* ==========================================
     4. STATISZTIKA ÉS HISTÓRIA KEZELÉS
     ========================================== */
  function getAveragePercentage() {
    if (testHistory.length === 0) return 0;
    const sum = testHistory.reduce((acc, item) => acc + item.percentage, 0);
    return Math.round(sum / testHistory.length);
  }

  function showResultsModal(currentResult) {
    const body = document.getElementById('modalBody');
    const avg = getAveragePercentage();

    body.innerHTML = `
      <div class="stats-card">
        <div class="stats-item">
          <h4>Meno / Név</h4>
          <p>${currentResult.name}</p>
        </div>
        <div class="stats-item">
          <h4>Skóre / Pont</h4>
          <p>${currentResult.score}</p>
        </div>
        <div class="stats-item">
          <h4>Úspešnosť</h4>
          <p>${currentResult.percentage}%</p>
        </div>
        <div class="stats-item">
          <h4>Priemer testov</h4>
          <p style="color: #2e7d32;">${avg}%</p>
        </div>
        <div class="stats-item">
          <h4>Známka</h4>
          <p>${currentResult.grade}</p>
        </div>
      </div>
      
      <h3>História testov a štatistika:</h3>
      ${renderHistoryTable()}
    `;

    document.getElementById('historyModal').style.display = 'flex';
  }

  function renderHistoryTable() {
    if (testHistory.length === 0) return '<p style="margin-top:10px;">Žiadne záznamy.</p>';
    let html = `
      <table class="history-table">
        <thead>
          <tr>
            <th>Dátum</th>
            <th>Meno</th>
            <th>Skóre</th>
            <th>Úspešnosť (%)</th>
            <th>Známka</th>
            <th>Čas</th>
          </tr>
        </thead>
        <tbody>
    `;

    testHistory.slice().reverse().forEach(h => {
      const m = Math.floor(h.duration / 60);
      const s = h.duration % 60;
      html += `
        <tr>
          <td>${h.date}</td>
          <td>${h.name}</td>
          <td>${h.score}</td>
          <td><b>${h.percentage}%</b></td>
          <td><b>${h.grade}</b></td>
          <td>${m}m ${s}s</td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    return html;
  }

  function openHistoryModal() {
    const body = document.getElementById('modalBody');
    const avg = getAveragePercentage();

    body.innerHTML = `
      <div class="stats-card">
        <div class="stats-item">
          <h4>Celkový počet testov</h4>
          <p>${testHistory.length}</p>
        </div>
        <div class="stats-item">
          <h4>Priemerná úspešnosť</h4>
          <p style="color: #2e7d32;">${avg}%</p>
        </div>
      </div>

      <h3>História výsledkov:</h3>
      ${renderHistoryTable()}
      <div style="margin-top: 15px; text-align: left;" class="no-print">
        <button class="btn btn-danger" onclick="clearHistory()">Vymazať celú štatistiku (Törlés)</button>
      </div>
    `;
    document.getElementById('historyModal').style.display = 'flex';
  }

  function closeHistoryModal() {
    document.getElementById('historyModal').style.display = 'none';
  }

  function clearHistory() {
    if (confirm('Naozaj chcete vymazať celú štatistiku a históriu testov?')) {
      testHistory = [];
      localStorage.removeItem('t9_test_history_v6');
      alert('Štatistika bola úspešne vymazaná.');
      if (document.getElementById('historyModal').style.display === 'flex') {
        openHistoryModal();
      }
    }
  }
</script>
